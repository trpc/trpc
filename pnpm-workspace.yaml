packages:
  - 'packages/*'
  - 'examples/*'
  - 'examples/.*/*'
  - 'examples/minimal/*'
  - 'examples/minimal-react/*'
  - 'examples/minimal-per-procedure-errors/*'
  - 'examples/minimal-content-types/*'
  - 'www'
  - 'www/api-reference'
  - 'www/og-image'
  - 'www/samples/*'
  - 'tooling/*'
publicHoistPattern:
  - '@types/*'
  - '!@types/parse-path'
  - 'playwright-core'
  - 'zod'
  - '!@prisma/*'
  - '!prisma'
sideEffectsCache: false
strictPeerDependencies: false
preferWorkspacePackages: true
linkWorkspacePackages: true
nodeOptions: --no-warnings

minimumReleaseAgeExclude:
  - sury@11.0.0

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  aws-sdk: true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  nx: true
  playwright: true
  prisma: true
  serverless: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  workerd: true

catalog:
  '@types/node': ^24.13.4
  tsdown: 0.23.0
  typescript: ^7.0.2
  oxlint: ^1.90.0
  oxlint-tsgolint: ^7.0.2005
  '@oxlint/plugins': ^1.90.0
  oxfmt: ^0.75.0
  vitest: ^5.0.0
  '@vitest/coverage-istanbul': ^5.0.0
  '@vitest/ui': ^5.0.0
  vite: ^8.3.0
  jsdom: ^30.0.1
  turbo: ^2.10.12
  undici: ^8.10.2
  ws: ^8.21.3
  devalue: ^6.0.0
  valibot: ^1.5.0
  fastify: ^5.12.4
  '@hey-api/openapi-ts': ^0.99.0
  '@fastify/websocket': ^11.3.0
  fastify-plugin: ^6.0.0
  next: ^15.5.25
  '@lerna-lite/cli': ^5.6.4
  '@lerna-lite/publish': ^5.6.4

