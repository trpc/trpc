packages:
  - 'packages/*'
  - 'examples/*'
  - 'examples/.*/*'
  - 'examples/minimal/*'
  - 'examples/minimal-react/*'
  - 'examples/minimal-content-types/*'
  - 'www'
  - 'www/og-image'
publicHoistPattern:
  - '@types/*'
  - 'playwright-core'
  - 'zod'
  - '!@prisma/*'
  - '!prisma'
sideEffectsCache: false
strictPeerDependencies: false
preferWorkspacePackages: true
linkWorkspacePackages: true
nodeOptions: --no-warnings

minimumReleaseAgeExclude:
  - sury@11.0.0

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  aws-sdk: true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  nx: true
  playwright: true
  prisma: true
  serverless: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  workerd: true

catalog:
  '@types/node': ^24.13.4
  tsdown: 0.23.0
  typescript: ^7.0.2
  eslint: ^10.10.0
  typescript-eslint: ^8.70.0
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-unicorn: ^74.0.0
  '@eslint/compat': ^2.1.1
  prettier: ^3.9.6
  prettier-plugin-tailwindcss: ^0.8.1
  '@ianvs/prettier-plugin-sort-imports': ^4.7.1
  vitest: ^5.0.0
  '@vitest/coverage-istanbul': ^5.0.0
  '@vitest/ui': ^5.0.0
  vite: ^8.3.0
  jsdom: ^30.0.1
  turbo: ^2.10.12
  undici: ^8.10.2
  ws: ^8.21.3
  devalue: ^5.9.2
  valibot: ^1.5.0
  fastify: ^5.12.4
  '@hey-api/openapi-ts': ^0.99.0
  '@fastify/websocket': ^11.3.0
  fastify-plugin: ^6.0.0
  next: ^15.5.25
  lerna: ^10.0.1

catalogs:
  ts-api:
    typescript: ^6.0.3
