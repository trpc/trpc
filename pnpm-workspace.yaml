packages:
  - 'packages/*'
  - 'examples/*'
  - 'examples/.*/*'
  - 'examples/minimal/*'
  - 'examples/minimal-react/*'
  - 'examples/minimal-per-procedure-errors/*'
  - 'examples/minimal-content-types/*'
  - 'www'
  - 'www/api-reference'
  - 'www/samples/*'
  - 'tooling/*'
publicHoistPattern:
  - '@types/*'
  - '!@types/parse-path'
  - 'playwright-core'
  - 'zod'
  - '!@prisma/*'
  - '!prisma'
sideEffectsCache: false
strictPeerDependencies: false
preferWorkspacePackages: true
linkWorkspacePackages: true
nodeOptions: --no-warnings

minimumReleaseAgeExclude:
  - sury@11.0.0

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  aws-sdk: true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  nx: true
  playwright: true
  prisma: true
  serverless: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  workerd: true

catalog:
  '@types/node': ^24.19.2
  tsdown: 0.23.7
  typescript: ^7.0.2
  oxlint: ^1.92.0
  oxlint-tsgolint: ^7.0.2006
