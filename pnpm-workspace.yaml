packages:
  # tRPC v11 (`@trpc/*`): kept, tested and published until 12.0.0.
  - 'v11'
  - 'v11/packages/*'
  - 'v11/examples/*'
  - 'v11/examples/.*/*'
  - 'v11/examples/minimal/*'
  - 'v11/examples/minimal-react/*'
  - 'v11/examples/minimal-per-procedure-errors/*'
  - 'v11/examples/minimal-content-types/*'
  - 'v11/tooling/*'
  # tRPC v12 (`@trpc12/*`).
  - 'v12'
  - 'v12/packages/*'
  - 'v12/examples/*'
  - 'v12/examples/experimental/*'
  - 'v12/examples/monorepo/packages/*'
  - 'v12/examples/monorepo/apps/*'
  - 'v12/test/*'
  - 'v12/spikes'
  - 'v12/tooling/*'
  # trpc.io, with every version's docs, and what it shares with the examples.
  - 'www'
  - 'www/api-reference'
  - 'www/samples/*'
  - 'tooling/*'

publicHoistPattern:
  - '@types/*'
  - '!@types/parse-path'
  # The root's `@types` reach every tsconfig without `types`: v12's Bun needs a
  # newer `@types/node` than v11's examples have, and serverless's lodash
  # declares a `WeakMap` TypeScript 5.9's doesn't match.
  - '!@types/bun'
  - '!@types/lodash'
  - 'playwright-core'
  - 'zod'
  - '!@prisma/*'
  - '!prisma'
sideEffectsCache: false
strictPeerDependencies: false
# v11's examples depend on `npm:@trpc/*` and get the workspace's packages.
# v12's exact `@trpc/*` pins (11.19.0) don't match them, so stay on npm.
preferWorkspacePackages: true
linkWorkspacePackages: true
nodeOptions: --no-warnings

minimumReleaseAgeExclude:
  - sury@11.0.0
  - vendor-src@0.16.0
  - '@orpc/client@2.0.0-beta.44'
  - '@orpc/contract@2.0.0-beta.44'
  - '@orpc/server@2.0.0-beta.44'
  - '@orpc/shared@2.0.0-beta.44'
  - typescript@7.1.0-beta
  - '@typescript/typescript-*'

# Vite+ runs every Vite and Vitest in the workspace on its own core.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.1.0
  # Except v11's Nuxt 3 example: its dev server on Vite 8 handles each
  # WebSocket upgrade twice, and the WebSocket test fails.
  '@nuxt/vite-builder>vite': 7.3.6
  'vite-node>vite': 7.3.6
  vitest@*: 5.0.3
  # vendor-src's `effect` is 4.0; platform-node-shared 4.1 needs effect 4.1.
  '@effect/platform-node@4.0.1>@effect/platform-node-shared': 4.0.2
  # tsdown 0.23's rolldown-plugin-dts (0.28) only takes TypeScript 7.0 for 7;
  # 0.29 emits v11's declarations with 7.1.
  'tsdown>rolldown-plugin-dts': 0.29.0

peerDependencyRules:
  allowedVersions:
    vite: '1.1.0'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  aws-sdk: true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  nx: true
  playwright: true
  prisma: true
  serverless: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  vue-demi: true
  workerd: true

catalog:
  '@types/node': ^24.19.2
  tsdown: 0.23.7
  typescript: 7.1.0-beta
  oxlint: ^1.90.0
  oxlint-tsgolint: ^7.0.2005
  '@oxlint/plugins': ^1.90.0
  oxfmt: ^0.75.0
  vitest: ^5.0.5
  '@vitest/coverage-istanbul': ^5.0.5
  '@vitest/ui': ^5.0.5
  vite: ^8.3.3
  jsdom: ^31.0.0
  turbo: ^2.11.10
  undici: ^8.12.2
  ws: ^8.22.1
  devalue: ^6.0.3
  valibot: ^1.5.0
  fastify: ^5.12.6
  '@hey-api/openapi-ts': ^0.99.0
  '@fastify/websocket': ^11.3.7
  fastify-plugin: ^6.0.1
  next: ^16.4.5
  '@effect/platform-node': 4.1.2
  effect: 4.1.2
catalogs:
  ts-api:
    typescript: ^6.0.3
  www:
    '@fastify/websocket': 11.3.7
    '@resvg/resvg-wasm': 2.6.2
    '@tanstack/react-router': 1.170.46
    '@tanstack/react-start': 1.169.4
    '@types/aws-lambda': 8.10.164
    '@types/cors': 2.8.19
    '@types/event-source-polyfill': 1.0.5
    '@types/express': 5.0.6
    '@types/react': 19.3.0
    '@types/react-dom': 19.3.0
    '@types/ws': 8.18.2
    '@vitejs/plugin-react': 6.2.1
    arktype: 2.2.9
    class-variance-authority: 0.7.1
    cors: 2.8.6
    date-fns: 4.4.0
    effect: 4.1.2
    event-source-polyfill: 1.0.31
    express: 5.3.0
    # The v11 docs' blocks pass it to `@trpc/server`'s adapter, whose
    # `fastify: ^5.12.6` resolves to the workspace's newest.
    fastify: 5.12.8
    react-dom: 19.3.1
    react: 19.3.1
    runtypes: 7.0.5
    scale-codec: 0.13.0
    server-only: 0.0.1
    superjson: 2.2.6
    superstruct: 2.0.2
    tailwindcss: 4.3.5
    typescript: 5.9.3
    ws: 8.22.1
    yup: 1.7.1
    zod: 4.6.7
