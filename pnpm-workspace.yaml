  fastify: ^5.12.6
  '@hey-api/openapi-ts': ^0.99.0
  '@fastify/websocket': ^11.3.7
  fastify-plugin: ^6.0.1
  next: ^16.4.5
  '@effect/platform-node': 4.1.2
  effect: 4.1.2
