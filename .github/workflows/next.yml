name: next

on:
  push:
    branches: [v12]
    paths:
      - 'next/**'
      - 'vendor-src.json'
      - '.github/workflows/next.yml'
      - '.github/actions/next-setup/**'
  pull_request:
    paths:
      - 'next/**'
      - 'vendor-src.json'
      - '.github/workflows/next.yml'
      - '.github/actions/next-setup/**'
  schedule:
    # New effect@4 releases reach users without a push here.
    - cron: '0 6 * * 1'

concurrency:
  group: next-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: next

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The realtime example fans events out through Redis; the Redis locker test locks in it.
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 10
      # The realtime example's Postgres publisher.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 2s --health-retries 10
    outputs:
      pnpm-store-key: ${{ steps.setup.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/next-setup
        with:
          save-cache: 'true'
      - run: pnpm typecheck
      - run: pnpm check
      # The tests, failing under 98% coverage on any metric.
      - run: pnpm coverage
        env:
          REDIS_URL: redis://127.0.0.1:6379
      # examples/runtime-matrix serves its router on Bun and Deno too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
          no-cache: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      # examples/react-spa and the experimental React apps drive the runner's
      # preinstalled Google Chrome.
      - run: pnpm example
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Client bundle sizes, reported only: there are no ceilings.
      - run: pnpm bench budget

  www:
    # The docs site: compiles every twoslash block in docs/ and the v11 docs'
    # copies, and fails on broken links between pages.
    runs-on: ubuntu-latest
    # A cold twoslash cache (any lockfile change) compiles all ~530 blocks.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/next-setup
      # Compiled blocks, keyed by the lockfile inside; a stale entry recompiles.
      - uses: actions/cache@v4
        with:
          path: next/www/node_modules/.cache/twoslash
          key: twoslash-${{ hashFiles('next/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: twoslash-${{ hashFiles('next/pnpm-lock.yaml') }}-
      - run: pnpm --filter @trpc12/www build

  effect-latest:
    # `@trpc12/trpc` has `effect@^4` as a peer; users get the latest 4.x, the lockfile pins one.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/next-setup
        with:
          install: 'false'
      - name: Widen effect pins to ^4 and update to the latest 4.x
        run: |
          for f in $(git ls-files '*package.json'); do
            sed -i -E 's/"(effect|@effect\/[a-z-]+)": "4\.[0-9]+\.[0-9]+"/"\1": "^4.0.0"/' "$f"
          done
          pnpm install --no-frozen-lockfile
          pnpm update -r effect '@effect/*'
          grep -E '^  effect@' pnpm-lock.yaml
        env:
          VP_GIT_HOOKS: '0'
      - run: pnpm typecheck
      - run: pnpm test

  bun:
    # The platform layer is injected; this serves through @effect/platform-bun.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
          no-cache: true
      - uses: ./.github/actions/next-setup
      - run: pnpm test:bun

  cloudflare-deploy:
    # Deploys examples/cloudflare and runs its client against the deployed
    # Worker. Skipped until the repo has the CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/v12'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for credentials
        id: credentials
        working-directory: .
        run: echo "present=${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.credentials.outputs.present == 'true'
        uses: actions/checkout@v7
      - if: steps.credentials.outputs.present == 'true'
        uses: ./.github/actions/next-setup
      - if: steps.credentials.outputs.present == 'true'
        name: Deploy
        id: deploy
        working-directory: next/examples/cloudflare
        run: |
          pnpm run deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: steps.credentials.outputs.present == 'true'
        name: Smoke the deployed Worker
        working-directory: next/examples/cloudflare
        run: pnpm client "$SMOKE_URL"
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.url }}

  prune-pnpm-store-caches:
    # Each lockfile change on v12 saves a ~400 MB store, and the repo's 10 GB
    # of caches is shared with main: keep only the current lockfile's store.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/v12' && needs.check.outputs.pnpm-store-key != '' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - working-directory: .
        run: |
          caches=$(gh cache list --ref "$GITHUB_REF" --key "${KEEP%-*}-" --limit 100 --json id,key)
          if ! jq -e --arg keep "$KEEP" 'any(.[]; .key == $keep)' <<< "$caches" > /dev/null; then
            echo "$KEEP isn't saved; keeping the older stores."
            exit 0
          fi
          jq -r --arg keep "$KEEP" '.[] | select(.key != $keep) | .id' <<< "$caches" | xargs -r -n1 gh cache delete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ needs.check.outputs.pnpm-store-key }}
