name: next

on:
  push:
    branches: [v12]
    paths:
      - 'next/**'
      - 'www/**'
      - 'tooling/**'
      # The site's v11 docs compile against v11's packages.
      - 'v11/packages/**'
      - 'vendor-src.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.github/actions/setup/**'
      - '.github/workflows/next.yml'
  pull_request:
    paths:
      - 'next/**'
      - 'www/**'
      - 'tooling/**'
      # The site's v11 docs compile against v11's packages.
      - 'v11/packages/**'
      - 'vendor-src.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - '.github/actions/setup/**'
      - '.github/workflows/next.yml'
  schedule:
    # New effect@4 releases reach users without a push here.
    - cron: '0 6 * * 1'

# A push to v12 runs to the end, so every pushed commit is covered by a
# finished run: cancelling on each push left most runs cancelled. A newer push
# still replaces a run that is waiting. A pull request's new push cancels its
# old run.
concurrency:
  group: next-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Turborepo's remote cache (Vercel's, for the team in TURBO_TEAM): a task
# whose inputs an earlier run or a laptop already ran replays its output.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

defaults:
  run:
    working-directory: next

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The realtime example fans events out through Redis; the Redis locker test locks in it.
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 10
      # The realtime example's Postgres publisher.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 2s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm check
      # The packages' tests, failing under 98% coverage on any metric. One
      # turbo run at a time: both use the one Redis.
      - run: pnpm turbo run coverage --filter=trpc-next
        env:
          REDIS_URL: redis://127.0.0.1:6379
      # Tooling's, examples' and spikes' tests, without coverage.
      - run: pnpm turbo run test:rest --filter=trpc-next
        env:
          REDIS_URL: redis://127.0.0.1:6379
      # examples/runtime-matrix serves its router on Bun and Deno too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      # examples/react-spa and the experimental React apps drive the runner's
      # preinstalled Google Chrome.
      - run: pnpm example
        env:
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Client bundle sizes, reported only: there are no ceilings.
      - run: pnpm bench budget

  www:
    # The docs site (www/): its lint, types and tests, the formatting of
    # everything outside v11/ and next/, then the build, which compiles every
    # twoslash block in every version's docs and the blog, and fails on broken
    # links between pages.
    runs-on: ubuntu-latest
    # A cold twoslash cache compiles all ~670 blocks.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format
      - run: pnpm check:www
      # Compiled blocks and social cards. Each entry is keyed by what it was
      # made from (the part of the lockfile a block's app installs from,
      # say), so any earlier run's cache is safe to start from.
      - uses: actions/cache@v4
        with:
          path: www/node_modules/.cache
          key: www-cache-${{ github.sha }}
          restore-keys: www-cache-
      - run: pnpm turbo run build --filter=www
      # Every decisions page fits a phone, a tablet and a laptop.
      - run: pnpm --filter www decisions:layout
      # A URL without a page gets 404.html, which hydrates without a mismatch.
      - run: pnpm --filter www not-found:check
      # The codemod runs on its page without cross-origin isolation, and the
      # playground fits a phone.
      - run: pnpm --filter www codemod-playground:check
      # Search finds every experiment's pages with every experiment off, from
      # v12's home page too, and opening one turns its experiment on.
      - run: pnpm --filter www search:check

  www-trpc-io:
    # The docs site as trpc.io's build (`site.url` at https://trpc.io), where
    # v12 is hidden: its UI shows only to a session that has been to v12.
    # Beside `www`, so it adds a build's minutes but no wait.
    runs-on: ubuntu-latest
    # A cold twoslash cache compiles all ~670 blocks.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Only `www` saves it, under this run's key.
      - uses: actions/cache/restore@v4
        with:
          path: www/node_modules/.cache
          key: www-cache-${{ github.sha }}
          restore-keys: www-cache-
      # A no-op once the cutover has made it the URL.
      - name: Build as trpc.io
        run: |
          sed -i "s|^  url: 'https://v12.trpc.io',|  url: 'https://trpc.io',|" www/src/site.ts
          grep -q "^  url: 'https://trpc.io'," www/src/site.ts
          pnpm turbo run build --filter=www
      # v12's UI is hidden, then shown for the session after ?version=12 or
      # /v12, with no hydration error.
      - run: pnpm --filter www v12-reveal:check

  effect-latest:
    # `@trpc12/trpc` has `effect@^4.1` as a peer; users get the latest 4.x, the lockfile pins one.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      # next/'s packages only (`git ls-files` and `--filter` are relative to
      # next/): v11 and the site keep the lockfile's.
      - name: Widen effect pins to ^4.1 and update to the latest 4.x
        run: |
          for f in $(git ls-files '*package.json'); do
            sed -i -E 's/"(effect|@effect\/[a-z-]+)": "4\.[0-9]+\.[0-9]+"/"\1": "^4.1.0"/' "$f"
          done
          pnpm install --no-frozen-lockfile
          # Direct dependencies only: vendor-src pins its own effect 4.0.1 stack.
          pnpm update --filter './**' --depth 0 effect '@effect/*'
          grep -E '^  effect@' ../pnpm-lock.yaml
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          VP_GIT_HOOKS: '0'
      # Turbo hashes each package's resolved dependencies, so these installs
      # replay nothing of the check job's.
      - run: pnpm typecheck
      - run: pnpm test

  node-lts:
    # The repo develops on .nvmrc's Node; users still run the active LTS.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: 24
      - run: pnpm test --project 'packages*'
        env:
          REDIS_URL: redis://127.0.0.1:6379

  bun:
    # The platform layer is injected; this serves through @effect/platform-bun.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: ./.github/actions/setup
      - run: pnpm test:bun

  cloudflare-deploy:
    # Deploys examples/cloudflare and runs its client against the deployed
    # Worker. Skipped until the repo has the CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/v12'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for credentials
        id: credentials
        working-directory: .
        run: echo "present=${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.credentials.outputs.present == 'true'
        uses: actions/checkout@v7
      - if: steps.credentials.outputs.present == 'true'
        uses: ./.github/actions/setup
      - if: steps.credentials.outputs.present == 'true'
        name: Deploy
        id: deploy
        working-directory: next/examples/cloudflare
        run: |
          pnpm run deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: steps.credentials.outputs.present == 'true'
        name: Smoke the deployed Worker
        working-directory: next/examples/cloudflare
        run: pnpm client "$SMOKE_URL"
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.url }}
