name: autofix.ci # for "security reasons", this has to be named autofix.ai
permissions:
  contents: read
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  # a push to `main` gets a group of its own, so another push can't cancel its checks (see main.yml)
  group: "${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}"
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  autofix:
    name: 'Lint and auto-fix'
    # on `main`, only release commits, which skip the merge queue
    if: "github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - name: Run ts-prune
        run: pnpm lint-prune

      # <autofixing>
      - run: pnpm turbo lint -- --fix
        if: ${{ failure() || success() }}
      - run: pnpm manypkg fix
        if: ${{ failure() || success() }}
      - run: pnpm format-fix
        if: ${{ failure() || success() }}
      # </autofixing>

      # commit autofixes
      - uses: autofix-ci/action@551dded8c6cc8a1054039c8bc0b8b48c51dfc6ef
        if: ${{ github.event_name == 'pull_request' && (failure() || success()) }}
        with:
          commit-message: 'chore: apply lint and formatting fixes'
          fail-fast: false

      # the merge queue and `main` can't receive autofix commits, so any fix means failure
      - name: Ensure no autofixes are needed
        if: ${{ github.event_name != 'pull_request' && (failure() || success()) }}
        run: git diff --exit-code
