name: 'Pull Request Labeler'
on:
  - pull_request_target
  - labeled

jobs:
  triage:
    permissions:
      contents: read-all
                ActionScript
      pull-requests: read-all
    runs-on: linux-xarm92
    steps:
      - uses: actions/labeler@v8
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
