name: main
# Not on pushes to `main`: every commit there passed the merge queue, which ran these on that same commit.
on:
  pull_request:
    types: [synchronize, opened, reopened]
  merge_group:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: pnpm build

  typecheck:
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: pnpm typecheck-packages

  verify-packed:
    name: Verify packed packages as a consumer
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: pnpm build
      # Generates the agent skills we publish for TanStack Intent from the docs (https://trpc.io/docs/skills) and checks them
      - name: Generate and validate agent skills
        run: pnpm validate-skills
      - run: pnpm verify-packed

  typecheck-www:
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: pnpm typecheck-www
      # Compiles the docs' and blog's code samples
      - run: pnpm --filter www check-twoslash

  test:
    name: unit and integration tests
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: MUTE_REACT_ACT_WARNINGS=1 pnpm test --coverage

      - name: Verify committed openapi test fixtures
        run: |
          if [[ -n "$(git status --porcelain -- packages/openapi/test/routers/)" ]]; then
            echo "Generated files in packages/openapi/test/routers/ are out of date."
            echo "Run 'pnpm -C packages/openapi codegen' locally and commit the resulting changes."
            git status --short -- packages/openapi/test/routers/
            echo ""
            echo "Diff for generated fixtures:"
            git --no-pager diff -- packages/openapi/test/routers/
            exit 1
          fi

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          # only use token if not a fork PR
          token: ${{ github.event.pull_request.head.repo.fork == false && secrets.CODECOV_TOKEN || '' }}

      # The site's tests import the packages it depends on from their builds
      - run: pnpm turbo --filter 'www^...' build
      - run: pnpm --filter www test

  # One example per adapter or runtime; the other examples aren't run here.
  e2e:
    name: 'E2E-tests (${{ matrix.dir }})'
    needs: [build]
    services:
      postgres:
        # Only the Prisma examples need a database. An empty image skips the service.
        image: ${{ contains(matrix.dir, 'prisma') && 'postgres' || '' }}
        env:
          POSTGRES_DATABASE: trpcdb
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
    env:
      NEXTAUTH_SECRET: supersecret
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      matrix:
        dir:
          [
            .experimental/next-app-dir,
            .test/internal-types-export,
            cloudflare-workers,
            express-server,
            fastify-server,
            minimal-react,
            next-prisma-starter,
            next-prisma-websockets-starter,
            openapi-codegen,
            standalone-server,
          ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup
        with:
          example: ${{ matrix.dir }}

      # The build job filled turbo's cache, so this restores the packages' builds
      - run: pnpm build

      - run: cp ./examples/${{ matrix.dir }}/.env.example ./examples/${{ matrix.dir }}/.env || true
      - run: pnpm turbo --filter ./examples/${{ matrix.dir }} test-dev
      - run: pnpm turbo --filter ./examples/${{ matrix.dir }} build
      - run: pnpm turbo --filter ./examples/${{ matrix.dir }} typecheck
      - run: pnpm turbo --filter ./examples/${{ matrix.dir }} test-start

  monotest-build:
    name: Test a monorepo using built declaration files
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup
      - run: pnpm monotest-build
