name: main
# Not on pushes to `main`: every commit there passed the merge queue, which ran these on that same commit.
on:
  pull_request:
    types: [synchronize, opened, reopened]
  merge_group:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: pnpm build

  typecheck:
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: pnpm typecheck-packages

  verify-packed:
    name: Verify packed packages as a consumer
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: pnpm build
      # Generates the agent skills we publish for TanStack Intent from the docs (https://trpc.io/docs/skills) and checks them
      - name: Generate and validate agent skills
        run: pnpm validate-skills
      - run: pnpm verify-packed

  typecheck-www:
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: pnpm typecheck-www
      # Compiles the docs' and blog's code samples
      - run: pnpm --filter www check-twoslash

  test:
    name: unit and integration tests
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: MUTE_REACT_ACT_WARNINGS=1 pnpm test --coverage

      - name: Verify committed openapi test fixtures
        run: |
          if [[ -n "$(git status --porcelain -- packages/openapi/test/routers/)" ]]; then
            echo "Generated files in packages/openapi/test/routers/ are out of date."
            echo "Run 'pnpm -C packages/openapi codegen' locally and commit the resulting changes."
            git status --short -- packages/openapi/test/routers/
            echo ""
            echo "Diff for generated fixtures:"
            git --no-pager diff -- packages/openapi/test/routers/
            exit 1
          fi

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          # only use token if not a fork PR
          token: ${{ github.event.pull_request.head.repo.fork == false && secrets.CODECOV_TOKEN || '' }}

      # The site's tests import the packages it depends on from their builds
      - run: pnpm turbo --filter 'www^...' build
      - run: pnpm --filter www test

  # One job per group of examples, not per example: a job spends most of its
  # time setting up and waiting for a runner.
  e2e:
    name: 'E2E-tests (${{ matrix.group }})'
    needs: [build]
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DATABASE: trpcdb
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
    env:
      NEXTAUTH_SECRET: supersecret
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: next
            dirs: .experimental/next-app-dir .test/ssg next-formdata next-minimal-starter
          - group: next-prisma
            dirs: next-prisma-starter next-prisma-todomvc next-prisma-websockets-starter
          - group: servers
            dirs: .test/internal-types-export express-minimal express-server fastify-server minimal-per-procedure-errors openapi-codegen soa standalone-server
          # tanstack-start-sse-chat is left out
          - group: runtimes
            dirs: bun cloudflare-workers deno-deploy minimal-react nuxt vercel-edge-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: pnpm build

      - if: matrix.group == 'runtimes'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - if: matrix.group == 'runtimes'
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.x

      # Runs every example, then fails if any did
      - env:
          DIRS: ${{ matrix.dirs }}
        run: |
          e2e() {
            if [ "$1" = deno-deploy ]; then
              cd "examples/$1" &&
                pnpm dlx start-server-and-test "deno run --allow-net=:8000 --allow-env ./src/index.ts" http://127.0.0.1:8000 "deno run --allow-net --allow-env ./src/client.ts"
              return
            fi
            cp "examples/$1/.env.example" "examples/$1/.env" 2>/dev/null
            pnpm turbo --filter "./examples/$1" test-dev &&
              pnpm turbo --filter "./examples/$1" build &&
              pnpm turbo --filter "./examples/$1" typecheck &&
              pnpm turbo --filter "./examples/$1" test-start
          }
          failed=()
          for dir in $DIRS; do
            echo "::group::$dir"
            (e2e "$dir") || failed+=("$dir")
            echo "::endgroup::"
          done
          for dir in "${failed[@]}"; do echo "::error title=E2E failed::$dir"; done
          [ ${#failed[@]} -eq 0 ]

  # https://pkg.pr.new
  release-tmp:
    name: Release using pkg.pr.new
    if: github.event_name == 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - run: pnpm build
      - run: pnpx pkg-pr-new publish './packages/*'

  monotest-build:
    name: Test a monorepo using built declaration files
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup
      - run: pnpm monotest-build
