name: v11 subtree-matrix
# Syncs the standalone examples to `trpc/examples-<name>`. They install
# `@trpc/*@latest`, so the release workflow syncs them all once a release is
# out. A push to main syncs only the examples whose files it changed, not
# counting `package.json`s, whose versions the copy replaces anyway.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      all:
        type: boolean
        required: true
    secrets:
      TRPC_DEPLOY_TOKEN:
        required: true
  push:
    branches:
      - 'main'
    paths:
      - 'v11/examples/**'
      - '!v11/examples/**/package.json'
concurrency:
  # Not `github.workflow`, which is the caller's when the release workflow
  # calls this. Every sync pushes main, so they share one group.
  group: subtree-main
  # A newer pending run would otherwise cancel a release's waiting sync
  queue: max
  cancel-in-progress: false # A sync stopped halfway leaves some examples behind
# Downstream pushes use the deploy key, not `GITHUB_TOKEN`
permissions:
  contents: read
jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        env:
          ALL: ${{ inputs.all || github.event_name == 'workflow_dispatch' }}
          BEFORE: ${{ github.event.before }}
        run: |
          examples=(
            .experimental/next-app-dir
            minimal-react
            minimal
            next-big-router
            next-formdata
            next-minimal-starter
            next-prisma-starter
            next-prisma-todomvc
            next-prisma-websockets-starter
            tanstack-start-sse-chat
          )
          # Sync all of them when the push's previous commit is unknown
          if [ "$ALL" != true ] && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            ALL=true
          fi
          picked=()
          for path in "${examples[@]}"; do
            if [ "$ALL" = true ] || [ -n "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- "v11/examples/$path" ":(exclude,glob)v11/examples/$path/**/package.json")" ]; then
              picked+=("$path")
            fi
          done
          matrix=$(printf '%s\n' "${picked[@]}" | jq -Rnc '[inputs | select(. != "") | {path: ., repo: ("trpc/examples-" + sub("^\\.experimental/"; ""))}]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Syncing: $matrix"

  sync-downstream:
    needs: pick
    if: needs.pick.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.matrix) }}
    name: Update ${{ matrix.repo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A sync pushes main's tip, not the commit that started it: a
          # release's sync can start after a newer push's, and force-pushing
          # the older commit would undo that push's examples.
          ref: main

      - uses: ./.github/actions/setup
        with:
          install: 'false'

      # Copies the `@shared/ui` files the example uses into it, and replaces
      # `catalog:` versions and `@trpc/*` (with `latest`), which only resolve
      # in the monorepo. See tooling/subtree.
      - name: Make the example standalone
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --filter @tooling/subtree
          pnpm --filter @tooling/subtree standalone "v11/examples/${{ matrix.path }}" "$RUNNER_TEMP/standalone"
          rm -rf "v11/examples/${{ matrix.path }}"
          mv "$RUNNER_TEMP/standalone" "v11/examples/${{ matrix.path }}"

      - name: Install dependencies and create separate lockfile
        run: |
          cd ./v11/examples/${{ matrix.path }}
          pnpm install --no-frozen-lockfile --ignore-scripts --ignore-workspace

      - name: Commit changes
        run: |
          git config --global user.email "<>"
          git config --global user.name "trpc-bot"
          git add .
          git commit -m "chore: sync lockfile"

      - name: Sync downstream
        uses: nxtlvlsoftware/git-subtree-action@1.1
        with:
          repo: ${{ matrix.repo }}
          path: 'v11/examples/${{ matrix.path }}'
          deploy_key: ${{ secrets.TRPC_DEPLOY_TOKEN }}
          force: true # will force push to the downstream repository
          branch: main # will push to the main branch of the downstream repository
