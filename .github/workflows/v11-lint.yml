name: autofix.ci # for "security reasons", this has to be named autofix.ai
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'v11/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.oxlintrc.json'
      - '.github/actions/setup/**'
      - '.github/workflows/v11-lint.yml'
  merge_group:
  push:
    branches: [v12]
    paths:
      - 'v11/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.oxlintrc.json'
      - '.github/actions/setup/**'
      - '.github/workflows/v11-lint.yml'

concurrency:
  # a push to `main` gets a group of its own, so another push can't cancel its checks (see main.yml)
  group: "${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}"
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

defaults:
  run:
    working-directory: v11

jobs:
  autofix:
    name: 'Lint and auto-fix'
    # on `main`, only release commits, which skip the merge queue; on v12, which has no PRs, every push
    if: "github.event_name != 'push' || github.ref == 'refs/heads/v12' || startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Run ts-prune
        run: pnpm lint-prune

      # <autofixing>
      # v11's packages, examples and tooling: `root` (v11/ itself) runs this.
      - run: pnpm turbo lint --filter='./**' --filter=!root --continue -- --fix
        if: ${{ failure() || success() }}
      - run: pnpm manypkg fix
        if: ${{ failure() || success() }}
      - run: pnpm format-fix
        if: ${{ failure() || success() }}
      # </autofixing>

      # commit autofixes
      - uses: autofix-ci/action@551dded8c6cc8a1054039c8bc0b8b48c51dfc6ef
        if: ${{ github.event_name == 'pull_request' && (failure() || success()) }}
        with:
          commit-message: 'chore: apply lint and formatting fixes'
          fail-fast: false

      # autofix.ci only commits to PRs, so on a push or in the merge queue any fix means failure
      - name: Ensure no autofixes are needed
        if: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && (failure() || success()) }}
        run: git diff --exit-code
