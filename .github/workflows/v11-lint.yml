name: autofix.ci # for "security reasons", this has to be named autofix.ai
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'v11/**'
      - '.github/actions/v11-setup/**'
      - '.github/workflows/v11-lint.yml'
  merge_group:
  push:
    branches: [v12]
    paths:
      - 'v11/**'
      - '.github/actions/v11-setup/**'
      - '.github/workflows/v11-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

defaults:
  run:
    working-directory: v11

jobs:
  autofix:
    name: 'Lint and auto-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/v11-setup

      - name: Run ts-prune
        run: pnpm lint-prune

      # <autofixing>
      - run: pnpm turbo lint -- --fix
        if: ${{ failure() || success() }}
      - run: pnpm manypkg fix
        if: ${{ failure() || success() }}
      - run: pnpm format-fix
        if: ${{ failure() || success() }}
      # </autofixing>

      # commit autofixes
      - uses: autofix-ci/action@551dded8c6cc8a1054039c8bc0b8b48c51dfc6ef
        if: ${{ github.event_name == 'pull_request' && (failure() || success()) }}
        with:
          commit-message: 'chore: apply lint and formatting fixes'
          fail-fast: false

      # autofix.ci only commits to PRs, so on a push or in the merge queue any fix means failure
      - name: Ensure no autofixes are needed
        if: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && (failure() || success()) }}
        run: git diff --exit-code
