name: subtree-matrix
# Syncs the standalone examples to `trpc/examples-<name>`. They install
# `@trpc/*@latest`, so the release workflow calls this once a release is out,
# and a push to main that changes the examples, which releases nothing, runs
# it too.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TRPC_DEPLOY_TOKEN:
        required: true
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/subtree.yml'
      - 'examples/**'
      - 'pnpm-workspace.yaml'
      - 'tooling/subtree/**'
      - 'tooling/ui/**'
  pull_request:
    paths:
      - '.github/workflows/subtree.yml'
      - 'examples/**'
      - 'pnpm-workspace.yaml'
      - 'tooling/subtree/**'
      - 'tooling/ui/**'
concurrency:
  # Not `github.workflow`, which is the caller's when the release workflow calls this.
  group: subtree-${{ github.ref }}
  cancel-in-progress: false # A sync stopped halfway leaves some examples behind
# Downstream pushes use the deploy key, not `GITHUB_TOKEN`
permissions:
  contents: read
jobs:
  sync-downstream:
    runs-on: ubuntu-latest
    # The Prisma and Drizzle examples migrate a database when they install or build.
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        path: [
            #
            .experimental/next-app-dir,
            minimal-react,
            minimal,
            next-big-router,
            next-formdata,
            next-minimal-starter,
            next-prisma-starter,
            next-prisma-todomvc,
            next-prisma-websockets-starter,
            tanstack-start-sse-chat,
          ]

    name: ${{ github.event_name == 'pull_request' && 'Check standalone' || 'Update downstream' }} ${{ matrix.path }} package

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A sync pushes main's tip, not the commit that started it: a
          # release's sync can start after a newer push's, and force-pushing
          # the older commit would undo that push's examples.
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
          # Pull requests run the examples' install and build scripts
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - name: Run find-and-replace to remove '.experimental/' from above paths
        uses: mad9000/actions-find-and-replace-string@5
        id: findandreplace
        with:
          source: ${{ matrix.path }}
          find: '.experimental/'
          replace: ''
      - name: Get the above output
        run: echo "The replaced value is ${{ steps.findandreplace.outputs.value }}"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      # Copies the `@shared/ui` files the example uses into it, and replaces
      # `catalog:` versions and `@trpc/*` (with `latest`), which only resolve
      # in the monorepo. See tooling/subtree.
      - name: Make the example standalone
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --filter @tooling/subtree
          pnpm --filter @tooling/subtree standalone "examples/${{ matrix.path }}" "$RUNNER_TEMP/standalone"
          rm -rf "examples/${{ matrix.path }}"
          mv "$RUNNER_TEMP/standalone" "examples/${{ matrix.path }}"

      - name: Install dependencies and create separate lockfile
        run: |
          cd ./examples/${{ matrix.path }}
          pnpm install --no-frozen-lockfile --ignore-scripts --ignore-workspace

      # Installs and builds the copy outside the monorepo, the way its README
      # says: npm for the npm workspaces (minimal-react), pnpm otherwise. The
      # copy doesn't list which dependencies may run build scripts (Prisma,
      # esbuild), which CI's pnpm otherwise refuses.
      - name: Build the standalone example
        if: github.event_name == 'pull_request'
        env:
          # For the examples without a committed `.env` (tanstack-start-sse-chat)
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: |
          cp -r "examples/${{ matrix.path }}" "$RUNNER_TEMP/example"
          cd "$RUNNER_TEMP/example"
          rm -rf node_modules
          build() {
            if node -e "process.exit(require('./package.json').workspaces ? 0 : 1)"; then
              npm install --no-audit --no-fund && npm run build
            else
              pnpm install --ignore-workspace --config.dangerously-allow-all-builds=true && pnpm build
            fi
          }
          # The published @trpc/server's next-app-dir adapter imports
          # `next/navigation` without `.js`, which Node can't resolve. Only that
          # failure is a warning.
          if [ "${{ matrix.path }}" = ".experimental/next-app-dir" ]; then
            set -o pipefail
            if ! build 2>&1 | tee "$RUNNER_TEMP/build.log"; then
              if grep -qF 'Did you mean to import "next/navigation.js"?' "$RUNNER_TEMP/build.log"; then
                echo "::warning::The standalone next-app-dir build fails until @trpc/server imports next/navigation.js"
              else
                exit 1
              fi
            fi
          else
            build
          fi

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.email "<>"
          git config --global user.name "trpc-bot"
          git add .
          git commit -m "chore: sync lockfile"

      - name: Sync downstream
        if: github.event_name != 'pull_request'
        uses: nxtlvlsoftware/git-subtree-action@1.1
        with:
          repo: 'trpc/examples-${{ steps.findandreplace.outputs.value }}'
          path: 'examples/${{ matrix.path }}'
          deploy_key: ${{ secrets.TRPC_DEPLOY_TOKEN }}
          force: true # will force push to the downstream repository
          branch: main # will push to the main branch of the downstream repository
