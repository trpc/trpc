name: Release Packages

# `pnpm release` (tooling/release) versions, publishes, tags and creates the
# GitHub release. npm trusted publishing is bound to this file's name and the
# npm-publish environment, so keep both.

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

permissions:
  contents: write # For pushing the release commit and tag, and the GitHub release
  id-token: write # For OIDC publishing and provenance

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'NPM distribution tag'
        required: true
        type: choice
        default: 'latest'
        options:
          - 'latest'
          - 'canary'
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - 'patch'
          - 'minor'
  push:
    branches:
      - 'main'
    paths:
      - '.github/setup/*'
      - '.github/workflows/release.yml'
      - 'packages/**'
      - '!packages/**/package.json'
      - '!packages/test/**'

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.dist_tag == 'latest'
    concurrency:
      group: release-stable
    timeout-minutes: 45 # npm can take a while to serve what it accepted
    runs-on: ubuntu-latest
    environment: npm-publish # npm trusted publishing is bound to this environment

    steps:
      - name: Require a repo admin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)
          if [ "$permission" != "admin" ]; then
            echo "::error::Only repo admins can publish stable releases (${ACTOR} has '${permission}')"
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: ./.github/setup

      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release stable ${{ inputs.version_bump }} --dist-tag ${{ inputs.dist_tag }} --provenance

  publish-canary:
    if: github.event_name == 'push' || inputs.dist_tag == 'canary'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: npm-publish # npm trusted publishing is bound to this environment

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/setup

      - run: pnpm release canary --provenance
