name: Release Packages

# `pnpm release` (tooling/release) versions, publishes, tags and creates the
# GitHub release. npm trusted publishing is bound to this file's name and the
# npm-publish environment, so keep both.
#
# Each release takes two jobs. The build job installs, builds and packs with
# no credentials, so the install and build scripts of every dependency can't
# reach any. The publish job gets the credentials; it installs only
# tooling/release, without running install scripts, runs it with node rather
# than through pnpm, and publishes the build job's tarballs once their names
# and versions are the ones it works out from the same commit.
#
# A push to main publishes a canary only if it changes what the packages
# publish (tooling/release/src/changes.ts), and never for a release commit.
# Once main settles, a stable release publishes what changed since the latest
# tag, if any of it changes what the packages publish. The workflow runs on
# every push, with no `paths:` filter, so a push after a run that skipped
# still releases what that run didn't, and a daily run retries from main's
# tip. Set the repo variable AUTO_RELEASE to `false` to stop stable releases;
# canaries keep going out.
#
# There's no manual run: stable releases are only automatic, and the commits
# decide the version (tooling/release/src/config.ts). No release publishes a
# major other than `releaseMajor` there. A new major takes a pull request that
# sets it to the next major; once that's merged, the automatic release
# publishes the new major's .0.0. A commit marked breaking (`feat!:`) fails
# the automatic release until then, unless its sha is in `notBreaking`.

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
  # Retries the automatic release from main's tip, in case its run failed or
  # main didn't settle; it releases nothing if there's nothing new.
  schedule:
    - cron: '17 4 * * *'

jobs:
  # Holds the automatic release until main settles: 10 minutes after the push
  # (about one merge queue run, so a PR enqueued just after a merge gets in),
  # then until the merge queue is empty. Only the run for main's tip goes on,
  # so a burst of merges releases once, from the last of them, whatever order
  # GitHub starts the runs in.
  #
  # A release commit starts it too. If its release stopped after pushing the
  # commit, this run publishes what npm is missing and tags it; otherwise the
  # tag is there and there's nothing to release.
  wait-for-merge-queue:
    if: vars.AUTO_RELEASE != 'false'
    concurrency:
      group: release-auto-wait-${{ github.sha }}
    timeout-minutes: 75
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.queue.outputs.ready }}

    steps:
      - name: Wait for the merge queue to empty
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          DEBOUNCE_SECONDS: 600
        run: |
          sleep "$DEBOUNCE_SECONDS"
          answered=false
          for _ in $(seq 60); do
            tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha) || tip=''
            if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
              echo "main moved to ${tip}; the run for it releases"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            queued=$(gh api graphql \
              -f query='query($owner: String!, $repo: String!) { repository(owner: $owner, name: $repo) { mergeQueue(branch: "main") { entries { totalCount } } } }' \
              -f owner="${GITHUB_REPOSITORY_OWNER}" -f repo="${GITHUB_REPOSITORY#*/}" \
              --jq '.data.repository.mergeQueue.entries.totalCount // 0') || queued=''
            if [ -n "$queued" ]; then
              answered=true
            fi
            if [ "$queued" = 0 ] && [ -n "$tip" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "${queued:-An unknown number of} pull requests in the merge queue; waiting"
            sleep 60
          done
          if [ "$answered" = false ]; then
            echo "::error::GitHub never answered which pull requests are in the merge queue, so there's no release"
            exit 1
          fi
          echo "::warning::The merge queue didn't empty for an hour, so there's no release; the next push to main, or tomorrow's scheduled run, releases what this one would have"
          echo "ready=false" >> "$GITHUB_OUTPUT"

  build-auto:
    needs: wait-for-merge-queue
    if: needs.wait-for-merge-queue.outputs.ready == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    outputs:
      packed: ${{ steps.pack.outputs.packed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/setup

      - name: Pack what changed
        id: pack
        run: |
          pnpm release auto --pack "$RUNNER_TEMP/release"
          if [ -f "$RUNNER_TEMP/release/commit" ]; then
            echo "packed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.pack.outputs.packed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          overwrite: true # Re-running the job uploads again
          retention-days: 7

  publish-auto:
    needs: build-auto
    if: needs.build-auto.outputs.packed == 'true'
    # Never cancelled by a newer push: if main moves before the release commit
    # is pushed, the push is rejected and nothing is published.
    concurrency:
      group: release-stable # A newer run's release waits for this one's tag
    timeout-minutes: 45 # npm can take a while to serve what it accepted
    runs-on: ubuntu-latest
    environment: npm-publish # npm trusted publishing is bound to this environment
    permissions:
      contents: write # For the GitHub release
      id-token: write # For OIDC publishing and provenance

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @tooling/release

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Release what changed
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url --push origin "https://x-access-token:${ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          node tooling/release/src/bin/release.ts auto --provenance --from "$RUNNER_TEMP/release"

  build-canary:
    # Not on the release commits the stable releases push, which carry the
    # stable versions.
    if: "github.event_name == 'push' && !(startsWith(github.event.head_commit.message, 'chore: release v') && github.event.head_commit.author.email == 'github-actions[bot]@users.noreply.github.com')"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    outputs:
      packed: ${{ steps.pack.outputs.packed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/setup

      # Only if the push changed what the packages publish.
      - name: Pack a canary
        id: pack
        env:
          SINCE: ${{ github.event.before }}
        run: |
          pnpm release canary --pack "$RUNNER_TEMP/release" --since "$SINCE"
          if [ -f "$RUNNER_TEMP/release/commit" ]; then
            echo "packed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.pack.outputs.packed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: canary
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          overwrite: true # Re-running the job uploads again
          retention-days: 7

  publish-canary:
    needs: build-canary
    if: needs.build-canary.outputs.packed == 'true'
    # Two runs for one commit publish the same canary.
    concurrency:
      group: release-canary-${{ github.sha }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: npm-publish # npm trusted publishing is bound to this environment
    permissions:
      contents: read
      id-token: write # For OIDC publishing and provenance

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @tooling/release

      - uses: actions/download-artifact@v8
        with:
          name: canary
          path: ${{ runner.temp }}/release

      - run: node tooling/release/src/bin/release.ts canary --provenance --from "$RUNNER_TEMP/release"
