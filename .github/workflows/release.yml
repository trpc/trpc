name: Release Packages

# `pnpm release` (tooling/release) versions, publishes, tags and creates the
# GitHub release. npm trusted publishing is bound to this file's name and the
# npm-publish environment, so keep both.
#
# Each release takes two jobs. The build job installs, builds and packs with
# no credentials, so the install and build scripts of every dependency can't
# reach any. The publish job gets the credentials; it installs only
# tooling/release, without running install scripts, runs it with node rather
# than through pnpm, and publishes the build job's tarballs once their names
# and versions are the ones it works out from the same commit.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'NPM distribution tag'
        required: true
        type: choice
        default: 'latest'
        options:
          - 'latest'
          - 'canary'
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - 'patch'
          - 'minor'
  push:
    branches:
      - 'main'
    paths:
      - '.github/setup/*'
      - '.github/workflows/release.yml'
      - 'packages/**'
      - '!packages/**/package.json'
      - '!packages/test/**'

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.dist_tag == 'latest'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/setup

      - run: pnpm release stable ${{ inputs.version_bump }} --pack "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          overwrite: true # Re-running the job uploads again
          retention-days: 7

  publish:
    needs: build
    concurrency:
      group: release-stable
    timeout-minutes: 45 # npm can take a while to serve what it accepted
    runs-on: ubuntu-latest
    environment: npm-publish # npm trusted publishing is bound to this environment
    permissions:
      contents: write # For the GitHub release
      id-token: write # For OIDC publishing and provenance

    steps:
      # Here rather than in build: re-running this job alone checks whoever re-runs it.
      - name: Require a repo admin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)
          if [ "$permission" != "admin" ]; then
            echo "::error::Only repo admins can publish stable releases (${ACTOR} has '${permission}')"
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @tooling/release

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Publish packages
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url --push origin "https://x-access-token:${ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          node tooling/release/src/bin/release.ts stable ${{ inputs.version_bump }} --dist-tag ${{ inputs.dist_tag }} --provenance --from "$RUNNER_TEMP/release"

  build-canary:
    if: github.event_name == 'push' || inputs.dist_tag == 'canary'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/setup

      - run: pnpm release canary --pack "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v7
        with:
          name: canary
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          overwrite: true # Re-running the job uploads again
          retention-days: 7

  publish-canary:
    needs: build-canary
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: npm-publish # npm trusted publishing is bound to this environment
    permissions:
      contents: read
      id-token: write # For OIDC publishing and provenance

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @tooling/release

      - uses: actions/download-artifact@v8
        with:
          name: canary
          path: ${{ runner.temp }}/release

      - run: node tooling/release/src/bin/release.ts canary --provenance --from "$RUNNER_TEMP/release"
