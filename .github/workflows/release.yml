name: Release Packages

# `pnpm release` (tooling/release) versions, publishes, tags and creates the
# GitHub release. npm trusted publishing is bound to this file's name and the
# npm-publish environment, so keep both.
#
# Each release takes two jobs. The build job installs, builds and packs with
# no credentials, so the install and build scripts of every dependency can't
# reach any. The publish jobs get the credentials; they install only
# tooling/release, without running install scripts, run it with node rather
# than through pnpm, and publish the build job's tarballs once their names
# and versions are the ones they work out from the same commit. One build job
# packs both the stable release and the canary, so a push installs once.
#
# Every push to main releases what changed since the latest tag, if any of it
# changes what the packages publish, like KATT/raf-query, and publishes a
# canary if what the packages publish changed since the latest canary
# (tooling/release/src/changes.ts). Neither happens for a release commit. The
# merge queue already batches pull requests, so there's no wait on top.
#
# A newer push cancels a build still in progress: its run releases everything
# that one would, and its canary has that one's changes. So commits that land
# close together release once. Publishing is never cancelled; a stable release
# whose push main has moved past publishes nothing (`publishStable` in
# tooling/release/src/release.ts). If GitHub starts an older run's build after
# a newer one's, or an old run is re-run, it cancels the build for main's tip.
# The workflow has no `paths:` filter, so the next push releases what that
# run didn't, and so does re-running the run for main's tip. A canary that
# failed partway through publishing goes out by re-running its failed jobs.
# Set the repo variable AUTO_RELEASE to `false` to stop stable releases;
# canaries keep going out.
#
# There's no manual run: stable releases are only automatic, and the commits
# decide the version (tooling/release/src/config.ts). No release publishes a
# major other than `releaseMajor` there. A new major takes a pull request that
# sets it to the next major; once that's merged, the automatic release
# publishes the new major's .0.0. A commit marked breaking (`feat!:`) fails
# the automatic release until then, unless its sha is in `notBreaking`.

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'

jobs:
  # Not on the release commits the stable releases push: there's nothing new
  # to release, and they carry the stable versions. If a release stopped after
  # pushing its commit, the next push resumes it, or tags it and releases
  # after it (`latestRelease` in tooling/release/src/release.ts).
  build:
    if: "!(startsWith(github.event.head_commit.message, 'chore: release v') && github.event.head_commit.author.email == 'github-actions[bot]@users.noreply.github.com')"
    concurrency:
      group: release-build
      cancel-in-progress: true
    timeout-minutes: 40
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    outputs:
      stable: ${{ steps.stable.outputs.packed }}
      canary: ${{ steps.canary.outputs.packed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/setup

      - name: Pack what changed
        id: stable
        if: vars.AUTO_RELEASE != 'false'
        run: |
          pnpm release auto --pack "$RUNNER_TEMP/release"
          if [ -f "$RUNNER_TEMP/release/commit" ]; then
            echo "packed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.stable.outputs.packed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          overwrite: true # Re-running the job uploads again
          retention-days: 7

      # Even if the stable pack failed, like on a commit marked breaking.
      - name: Undo the stable version bump
        if: "!cancelled()"
        run: git checkout --quiet -- .

      # Only if what the packages publish changed since the latest canary,
      # whose version ends in its commit's short sha. Without one, it packs.
      - name: Pack a canary
        id: canary
        if: "!cancelled()"
        run: |
          version=$(npm view @trpc/server@canary version 2>/dev/null) || version=
          pnpm release canary --pack "$RUNNER_TEMP/canary" --since "${version##*.g}"
          if [ -f "$RUNNER_TEMP/canary/commit" ]; then
            echo "packed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: "!cancelled() && steps.canary.outputs.packed == 'true'"
        uses: actions/upload-artifact@v7
        with:
          name: canary
          path: ${{ runner.temp }}/canary
          if-no-files-found: error
          overwrite: true # Re-running the job uploads again
          retention-days: 7

  publish-auto:
    needs: build
    # Even if the canary failed to pack.
    if: "!cancelled() && needs.build.outputs.stable == 'true'"
    # Never cancelled by a newer push: if main moves before the release commit
    # is pushed, the push is rejected and nothing is published.
    concurrency:
      group: release-stable # A newer run's release waits for this one's tag
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: npm-publish # npm trusted publishing is bound to this environment
    permissions:
      contents: write # For the GitHub release
      id-token: write # For OIDC publishing and provenance

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @tooling/release

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Release what changed
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url --push origin "https://x-access-token:${ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          node tooling/release/src/bin/release.ts auto --provenance --from "$RUNNER_TEMP/release"

  publish-canary:
    needs: build
    # Even if the stable release failed to pack.
    if: "!cancelled() && needs.build.outputs.canary == 'true'"
    # Two runs for one commit publish the same canary.
    concurrency:
      group: release-canary-${{ github.sha }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: npm-publish # npm trusted publishing is bound to this environment
    permissions:
      contents: read
      id-token: write # For OIDC publishing and provenance

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @tooling/release

      - uses: actions/download-artifact@v8
        with:
          name: canary
          path: ${{ runner.temp }}/release

      - run: node tooling/release/src/bin/release.ts canary --provenance --from "$RUNNER_TEMP/release"
