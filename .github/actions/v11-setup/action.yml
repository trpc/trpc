name: v11 setup
description: Composite action that sets up pnpm for the v11 workspace in v11/
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: v11/package.json
    - uses: actions/setup-node@v7
      with:
        node-version-file: 'v11/.nvmrc'

    - name: Get pnpm store directory
      shell: bash
      id: pnpm-cache
      working-directory: v11
      run: |
        echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT
    - uses: actions/cache/restore@v6
      name: Restore pnpm cache
      id: restore-pnpm-cache
      with:
        path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
        key: ${{ runner.os }}-v11-pnpm-store-${{ hashFiles('v11/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-v11-pnpm-store-
    - run: pnpm install
      shell: bash
      working-directory: v11
    # Only pushes to v12 save, so a PR, a fork's included, can't write a store v12 restores.
    - uses: actions/cache/save@v6
      name: Save pnpm cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/v12' && steps.restore-pnpm-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
        key: ${{ steps.restore-pnpm-cache.outputs.cache-primary-key }}
