exclude-reads:
  - e2e/.gitignore
  - '**/src/routeTree.gen.ts'
exclude-writes:
  - '**/src/routeTree.gen.ts'
task-exclusions:
  - target: test:build
    exclude-reads:
      - LICENSE
  # HMR tests edit these inputs in place and restore their original contents.
  # Keep them out of cached outputs so cache replay never overwrites source.
  - project: tanstack-react-start-e2e-deferred-hydration
    target: test:e2e
    exclude-writes:
      - e2e/react-start/deferred-hydration/src/routes/components.tsx
  - project: tanstack-react-start-e2e-hmr
    target: test:e2e
    exclude-writes: &hmr-source-writes
      - e2e/react-start/hmr/src/components/AliasedRouteImportChildPanel.tsx
      - e2e/react-start/hmr/src/components/AliasedRouteImportParentPanel.tsx
      - e2e/react-start/hmr/src/hmr/server-fn-hmr-factory.ts
      - e2e/react-start/hmr/src/routes/__root.tsx
      - e2e/react-start/hmr/src/routes/child.tsx
      - e2e/react-start/hmr/src/routes/component-hmr-inline-error-split.tsx
      - e2e/react-start/hmr/src/routes/component-hmr-inline-nosplit.tsx
      - e2e/react-start/hmr/src/routes/component-hmr-inline-split.tsx
      - e2e/react-start/hmr/src/routes/component-hmr-lowercase-named-split.tsx
      - e2e/react-start/hmr/src/routes/component-hmr-named-error-split.tsx
      - e2e/react-start/hmr/src/routes/component-hmr-named-nosplit.tsx
      - e2e/react-start/hmr/src/routes/component-hmr-named-split.tsx
      - e2e/react-start/hmr/src/routes/index.tsx
      - e2e/react-start/hmr/src/routes/inputs.tsx
  - project: tanstack-react-start-e2e-hmr
    target: test:e2e--vite-ssr
    exclude-writes: *hmr-source-writes
  - project: tanstack-react-start-e2e-hmr
    target: test:e2e--vite-ssr--bundled-dev
    exclude-writes: *hmr-source-writes
  - project: tanstack-react-start-e2e-hmr
    target: test:e2e--rsbuild-ssr
    exclude-writes: *hmr-source-writes
  - project: tanstack-react-start-e2e-rsbuild
    target: test:e2e--rsbuild-ssr
    exclude-writes:
      - e2e/react-start/rsbuild/src/routes/index.tsx
  - project: tanstack-react-start-e2e-server-functions
    target: test:e2e
    exclude-writes:
      - e2e/react-start/server-functions/src/routes/consistent.tsx
  # Scaffolding tests deliberately populate tracked empty route fixtures.
  - project: '@tanstack/router-generator'
    target: test:unit
    exclude-writes:
      - packages/router-generator/tests/generator/custom-scaffolding/routes/__root.tsx
      - packages/router-generator/tests/generator/custom-scaffolding/routes/api/bar.tsx
      - packages/router-generator/tests/generator/custom-scaffolding/routes/foo.lazy.tsx
      - packages/router-generator/tests/generator/custom-scaffolding/routes/index.tsx
  # These reads are of scratch files created by the same test invocation.
  - project: tanstack-solid-start-e2e-basic-auth
    target: test:e2e
    exclude-reads:
      - e2e/solid-start/basic-auth/.tmp/dev.db
  - project: tanstack-vue-start-e2e-basic-auth
    target: test:e2e
    exclude-reads:
      - e2e/vue-start/basic-auth/.tmp/dev.db
  - project: '@tanstack/router-generator'
    target: test:unit
    exclude-reads:
      - packages/router-generator/tests/generator/file-modification/routes/[(]test[)]/initiallyEmpty.tsx
      - packages/router-generator/tests/generator/file-modification/routes/[(]test[)]/initiallyEmpty.lazy.tsx
  # Mutable counters are scratch state, not artifacts to replay from cache.
  - project: tanstack-react-start-e2e-basic-tsr-config
    target: test:e2e
    exclude-reads:
      - e2e/react-start/basic-tsr-config/count.txt
    exclude-writes:
      - e2e/react-start/basic-tsr-config/count.txt
  - project: tanstack-solid-start-e2e-basic-tsr-config
    target: test:e2e
    exclude-reads:
      - e2e/solid-start/basic-tsr-config/count.txt
    exclude-writes:
      - e2e/solid-start/basic-tsr-config/count.txt
  - project: tanstack-vue-start-e2e-basic-tsr-config
    target: test:e2e
    exclude-reads:
      - e2e/vue-start/basic-tsr-config/count.txt
    exclude-writes:
      - e2e/vue-start/basic-tsr-config/count.txt
  # Paraglide downloads compiler plugins from the URLs in settings.json.
  # Ignore warm-cache reads; the settings remain inputs and cache files outputs.
  - project: tanstack-react-start-e2e-i18n-paraglide
    target: build
    exclude-reads:
      - e2e/react-start/i18n-paraglide/project.inlang/cache/plugins/*
  - project: tanstack-router-e2e-react-i18n-paraglide
    target: build
    exclude-reads:
      - e2e/react-router/i18n-paraglide/project.inlang/cache/plugins/*
  - project: tanstack-react-start-e2e-i18n-paraglide
    target: test:e2e
    exclude-reads:
      - e2e/react-start/i18n-paraglide/project.inlang/cache/plugins/*
  - project: tanstack-router-e2e-react-i18n-paraglide
    target: test:e2e
    exclude-reads:
      - e2e/react-router/i18n-paraglide/project.inlang/cache/plugins/*
  - project: tanstack-router-i18n-paraglide
    target: build
    exclude-reads:
      - examples/react/i18n-paraglide/project.inlang/cache/plugins/*
  - project: tanstack-start-i18n-paraglide
    target: build
    exclude-reads:
      - examples/react/start-i18n-paraglide/project.inlang/cache/plugins/*
  - project: tanstack-router-solid-i18n-paraglide
    target: build
    exclude-reads:
      - examples/solid/i18n-paraglide/project.inlang/cache/plugins/*
  - project: tanstack-solid-start-i18n-paraglide
    target: build
    exclude-reads:
      - examples/solid/start-i18n-paraglide/project.inlang/cache/plugins/*
