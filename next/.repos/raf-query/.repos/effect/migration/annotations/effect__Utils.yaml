"effect/Utils#adapter":
  replacement: "none"
  note: "Remove the adapter and resume parameter; v4 generators yield yieldable values directly."
"effect/Utils#Adapter":
  replacement: "none"
  note: "The generator-adapter type was removed; type generator bodies to yield v4 yieldable values directly."
"effect/Utils#Gen":
  replacement: "Utils.Gen"
  note: "Still exported; drop the adapter type and resume parameter, then yield yieldable Kind values directly."
"effect/Utils#GenKind":
  replacement: "none"
  note: "The adapter wrapper was removed; custom yieldable Kinds should implement Symbol.iterator and return Utils.SingleShotGen."
"effect/Utils#GenKindImpl":
  replacement: "none"
  note: "The wrapper implementation was removed; implement direct yieldability with Symbol.iterator and Utils.SingleShotGen."
"effect/Utils#GenKindTypeId":
  replacement: "none"
  note: "The GenKind runtime marker was removed with the wrapper infrastructure."
"effect/Utils#internalCall":
  replacement: "none"
  note: "This was internal and has no public replacement; application code should invoke its thunk directly."
"effect/Utils#isGeneratorFunction":
  replacement: "none"
  note: "The unused constructor-identity predicate was removed; accept an explicit generator contract instead."
"effect/Utils#isGenKind":
  replacement: "none"
  note: "Removed with GenKind; v4 generator drivers consume directly yielded values."
"effect/Utils#makeGenKind":
  replacement: "none"
  note: "The wrapper constructor was removed; make custom Kinds yieldable with Symbol.iterator and Utils.SingleShotGen."
"effect/Utils#OptionalNumber":
  replacement: "number | null | undefined"
  note: "The unused named alias was removed; inline its union."
"effect/Utils#PCGRandom":
  replacement: "Random.withSeed + Random.next / Random.nextIntBetween"
  note: "Use the effectful Random service for seeded generation; v4 is not PCG-compatible."
"effect/Utils#PCGRandomState":
  replacement: "none"
  note: "No public PCG state snapshot or restore API remains; Random.withSeed is reproducible but not state-compatible."
"effect/Utils#SingleShotGen":
  replacement: "Utils.SingleShotGen"
  note: "Still exported; v4 removes its concrete return and throw methods, so do not call those optional iterator hooks."
"effect/Utils#structuralRegion":
  replacement: "none"
  note: "Remove the wrapper because v4 Equal.equals is structural by default; use a custom Equivalence for custom comparison."
"effect/Utils#structuralRegionState":
  replacement: "none"
  note: "The mutable test hook was removed; v4 equality is structural by default."
"effect/Utils#Variance":
  replacement: "Utils.Variance"
  note: "Still exported; remove the v3 GenKindTypeId marker from implementations."
"effect/Utils#YieldWrap":
  replacement: "none"
  note: "The internal generator transport wrapper was removed; yieldable values are yielded directly."
"effect/Utils#yieldWrapGet":
  replacement: "none"
  note: "The internal unwrapper was removed; generator drivers read the directly yielded value."
"effect/Utils#YieldWrapTypeId":
  replacement: "none"
  note: "The internal wrapper marker was removed with YieldWrap."
