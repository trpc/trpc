"@effect/platform/WorkerRunner#BackingRunner":
  replacement: "WorkerRunner.WorkerRunner"
  note: "The low-level backing runner became the primary WorkerRunner interface."
"@effect/platform/WorkerRunner#BackingRunner.Message":
  replacement: "WorkerRunner.PlatformMessage"
  note: "The request/close wire tuple moved to the top-level PlatformMessage type."
"@effect/platform/WorkerRunner#CloseLatch":
  replacement: "none"
  note: "The public close-latch service was removed; WorkerRunner implementations manage lifetime through their run effect and adapter scope."
"@effect/platform/WorkerRunner#launch":
  replacement: "RpcServer.layerProtocolWorkerRunner"
  note: "For schema-defined workers, provide the worker-runner RPC protocol and launch the normal RpcServer layer."
"@effect/platform/WorkerRunner#layer":
  replacement: "WorkerRunner.WorkerRunnerPlatform.start + WorkerRunner.WorkerRunner.run"
  note: "The generic processing layer was removed; use the low-level runner directly or the RpcServer worker protocol."
"@effect/platform/WorkerRunner#layerCloseLatch":
  replacement: "none"
  note: "The public close-latch layer was removed; adapter runner lifetime is managed internally."
"@effect/platform/WorkerRunner#layerSerialized":
  replacement: "RpcServer.layerProtocolWorkerRunner"
  note: "Serialized tagged-request handlers moved to RpcGroup handlers served through the worker-runner RPC protocol."
"@effect/platform/WorkerRunner#make":
  replacement: "WorkerRunner.WorkerRunnerPlatform.start + WorkerRunner.WorkerRunner.run"
  note: "Start the platform runner and register the low-level message handler directly."
"@effect/platform/WorkerRunner#makeSerialized":
  replacement: "RpcServer.makeProtocolWorkerRunner"
  note: "Serialized tagged-request execution moved to RpcServer with an RpcGroup handler layer."
"@effect/platform/WorkerRunner#PlatformRunner":
  replacement: "WorkerRunner.WorkerRunnerPlatform"
  note: "The platform service was renamed and is now a Context.Service class."
"@effect/platform/WorkerRunner#PlatformRunnerTypeId":
  replacement: "none"
  note: "The Context.Service class replaces the public platform-runner type-id alias."
"@effect/platform/WorkerRunner#Runner":
  replacement: "WorkerRunner.WorkerRunner"
  note: "The namespace-only runner API was replaced by the low-level WorkerRunner interface."
"@effect/platform/WorkerRunner#Runner.Options":
  replacement: "none"
  note: "The custom decode/encode callbacks were removed; use raw low-level messages or define schemas in the v4 RPC model."
"@effect/platform/WorkerRunner#SerializedRunner":
  replacement: "RpcServer with RpcGroup handlers"
  note: "The serialized runner namespace was removed in favor of typed Rpc definitions and RpcServer."
"@effect/platform/WorkerRunner#SerializedRunner.Handlers":
  replacement: "RpcGroup.HandlersFrom"
  note: "Define an RpcGroup and derive its server handler object type with HandlersFrom."
"@effect/platform/WorkerRunner#SerializedRunner.HandlersContext":
  replacement: "RpcGroup.HandlersServices"
  note: "Derive services required by an RpcGroup handler object with HandlersServices."
"@effect/platform/WorkerRunner#SerializedRunner.InitialContext":
  replacement: "none"
  note: "Initial-message layer outputs are no longer inferred by this helper; model initialization as normal RpcGroup handler layers and services."
"@effect/platform/WorkerRunner#SerializedRunner.InitialEnv":
  replacement: "none"
  note: "Initial-message layer inputs are no longer inferred by this helper; model initialization as normal RpcGroup handler layers and services."
