"effect/Equivalence#all":
  replacement: "Equivalence.Tuple([...collection])"
  note: "Materialize the comparator iterable for Tuple. Unlike v3 prefix comparison, v4 requires equal input lengths; use Equivalence.make for intentional prefix semantics."
"effect/Equivalence#array":
  replacement: "Equivalence.Array"
  note: "Capitalized constructor name; positional equal-length array comparison is unchanged."
"effect/Equivalence#bigint":
  replacement: "Equivalence.BigInt"
  note: "Capitalized instance name; strict bigint equality is unchanged."
"effect/Equivalence#boolean":
  replacement: "Equivalence.Boolean"
  note: "Capitalized instance name; strict boolean equality is unchanged."
"effect/Equivalence#combineMany":
  replacement: "Equivalence.combine(self, Equivalence.combineAll(collection))"
  note: "Compose combine with combineAll; the dedicated dual combineMany helper was removed."
"effect/Equivalence#Equivalence":
  replacement: "Equivalence.Equivalence"
  note: "The callable type is retained but is now a type alias, so declaration merging is no longer supported."
"effect/Equivalence#number":
  replacement: "Equivalence.Number"
  note: "Capitalized instance name. V4 considers NaN equivalent to NaN; use Equivalence.strictEqual<number>() for exact v3 strict-equality behavior."
"effect/Equivalence#product":
  replacement: "Equivalence.Tuple([self, that])"
  note: "Replace the dual two-comparator helper with the single-array Tuple constructor."
"effect/Equivalence#productMany":
  replacement: "Equivalence.Tuple([self, ...collection])"
  note: "Materialize the comparator iterable in one Tuple call; v4 rejects unequal input lengths instead of using v3 prefix semantics."
"effect/Equivalence#strict":
  replacement: "Equivalence.strictEqual"
  note: "Renamed strict-equality constructor; call as Equivalence.strictEqual<A>()."
"effect/Equivalence#string":
  replacement: "Equivalence.String"
  note: "Capitalized instance name; case-sensitive strict equality is unchanged."
"effect/Equivalence#struct":
  replacement: "Equivalence.Struct"
  note: "Capitalized constructor name. V4 also compares configured symbol and non-enumerable keys via Reflect.ownKeys."
"effect/Equivalence#symbol":
  replacement: "Equivalence.strictEqual<symbol>()"
  note: "There is no Symbol instance export; strictEqual preserves the v3 symbol comparison."
"effect/Equivalence#tuple":
  replacement: "Equivalence.Tuple([eqA, eqB, ...])"
  note: "Capitalized constructor now takes one comparator array instead of rest arguments and rejects unequal input lengths."
