effect/MetricHook#MetricHook:
  replacement: "Metric.Metric.Hooks"
  note: "The closest public structural interface is Metric.Metric.Hooks<Input, State>; get, update, and modify also receive a Context."
effect/MetricHook#MetricHook.Root:
  replacement: "Metric.Metric.Hooks<any, any>"
  note: "The named aliases were removed; specialize the public Hooks interface directly when low-level typing is unavoidable."
effect/MetricHook#MetricHook.Untyped:
  replacement: "Metric.Metric.Hooks<any, any>"
  note: "The named aliases were removed; specialize the public Hooks interface directly when low-level typing is unavoidable."
effect/MetricHook#make:
  replacement: "none"
  note: "There is no public hook constructor; metric classes create and attach hooks internally."
effect/MetricHook#onModify:
  replacement: "none"
  note: "The operation-specific hook decorators were removed. Metric.mapInput cannot distinguish update from modify."
effect/MetricHook#onUpdate:
