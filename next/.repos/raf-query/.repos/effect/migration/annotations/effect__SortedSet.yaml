"effect/SortedSet#add":
  replacement: "HashSet.add"
  note: "Direct persistent add on the replacement set; sort only when traversing."
"effect/SortedSet#difference":
  replacement: "HashSet.difference + HashSet.fromIterable"
  note: "Convert the old general iterable argument to HashSet before taking the difference."
"effect/SortedSet#empty":
  replacement: "HashSet.empty"
  note: "SortedSet was removed; use an immutable HashSet and retain the element Order separately."
"effect/SortedSet#filter":
  replacement: "HashSet.filter"
  note: "Direct persistent filtering on the replacement set; traversal is unordered until explicitly sorted."
"effect/SortedSet#fromIterable":
  replacement: "HashSet.fromIterable"
  note: "Use HashSet.fromIterable and retain the element Order separately."
"effect/SortedSet#getEquivalence":
  replacement: "Equal.asEquivalence"
  note: "HashSet implements Effect equality by set content; use Equal.asEquivalence<HashSet.HashSet<A>>()."
"effect/SortedSet#intersection":
  replacement: "HashSet.intersection + HashSet.fromIterable"
  note: "Convert the old general iterable argument to HashSet before taking the intersection."
"effect/SortedSet#isSortedSet":
  replacement: "HashSet.isHashSet"
  note: "Use the replacement model guard; it does not prove that observations were sorted."
"effect/SortedSet#make":
  replacement: "HashSet.make"
  note: "Remove the outer order-curried constructor and pass values directly to HashSet.make."
"effect/SortedSet#map":
  replacement: "HashSet.map"
  note: "Remove the output Order argument; retain it externally and sort only when traversing."
"effect/SortedSet#partition":
  replacement: "HashSet.filter"
  note: "Build [excluded, satisfying] with complementary HashSet.filter calls."
"effect/SortedSet#remove":
  replacement: "HashSet.remove"
  note: "Direct persistent removal on the replacement set."
"effect/SortedSet#size":
  replacement: "HashSet.size"
  note: "Direct size query on the replacement immutable set."
"effect/SortedSet#SortedSet":
  replacement: "HashSet.HashSet"
  note: "Use HashSet as the immutable core model and retain Order externally; ordered iteration requires sorting on observation."
"effect/SortedSet#TypeId":
  replacement: "none"
  note: "The SortedSet brand was removed and HashSet.TypeId is private; use HashSet.isHashSet when a guard is needed."
"effect/SortedSet#union":
  replacement: "HashSet.union + HashSet.fromIterable"
  note: "Convert the old general iterable argument to HashSet before taking the union."
"effect/SortedSet#values":
  replacement: "Array.sort"
  note: "Sort the replacement HashSet with the retained Order and iterate the resulting array."
"effect/SortedSet#every":
  replacement: "HashSet.every"
  note: "Run the predicate against the replacement HashSet; sort first only if traversal order has observable effects."
"effect/SortedSet#has":
  replacement: "HashSet.has"
  note: "Use direct membership testing on the replacement HashSet."
"effect/SortedSet#some":
  replacement: "HashSet.some"
  note: "Run the predicate against the replacement HashSet; sort first only if traversal order has observable effects."
"effect/SortedSet#toggle":
  replacement: "HashSet.has + HashSet.add / HashSet.remove"
  note: "HashSet has no toggle; branch on membership and add or remove the element."
