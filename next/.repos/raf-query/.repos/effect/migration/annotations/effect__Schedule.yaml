"effect/Schedule#mapBoth":
  replacement: "Schedule.fromStep + Schedule.toStep"
  note: "Input transformation is no longer a standalone combinator. Wrap Schedule.toStep(self) with Schedule.fromStep and transform the input before invoking the underlying step."
"effect/Schedule#mapBothEffect":
  replacement: "Schedule.fromStep + Schedule.toStep"
  note: "Input transformation is no longer a standalone combinator. Wrap Schedule.toStep(self) with Schedule.fromStep and transform the input before invoking the underlying step. Apply the effectful output mapping to the returned tuple."
"effect/Schedule#mapEffect":
