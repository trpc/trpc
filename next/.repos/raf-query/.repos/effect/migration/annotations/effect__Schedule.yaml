"effect/Schedule#either":
  replacement: "Schedule.min"
  note: "Use Schedule.min for fastest-delay composition. It outputs the selected Duration rather than a tuple of both outputs."
"effect/Schedule#eitherWith":
  replacement: "Schedule.min"
  note: "Schedule.min implements the standard fastest-delay composition; custom interval merging requires a Schedule.fromStep implementation."
"effect/Schedule#elapsed":
  replacement: "Schedule.map"
