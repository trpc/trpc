"@effect/platform/HttpServerError#clientAbortFiberId":
  replacement: "HttpServerError.ClientAbort.annotation"
  note: "Client aborts now use a Cause context annotation rather than a sentinel FiberId."
"@effect/platform/HttpServerError#HttpServerError":
  replacement: "HttpServerError.HttpServerError | HttpServerError.ServeError"
  note: "Handler failures became a tagged wrapper, while ServeError remains separate."
"@effect/platform/HttpServerError#isServerError":
  replacement: "HttpServerError.isHttpServerError"
  note: "Renamed and narrowed to wrapped handler errors; test ServeError separately if needed."
"@effect/platform/HttpServerError#RequestError":
  replacement: "HttpServerError.RequestParseError (constructor) / HttpServerError.RequestError (type)"
  note: "The constructible class became RequestParseError; RequestError is now a broader type union."
"@effect/platform/HttpServerError#TypeId":
  replacement: "HttpServerError.isHttpServerError"
  note: "The brand is private in v4; use the public runtime refinement."
