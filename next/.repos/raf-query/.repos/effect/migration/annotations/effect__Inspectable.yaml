"effect/Inspectable#format":
  replacement: "Formatter.formatJson"
  note: "Use Formatter.formatJson(input, { space: 2 }) to preserve the v3 helper's pretty-printed JSON output."
"effect/Inspectable#redact":
  replacement: "Redactable.redact"
  note: "The redaction protocol moved to Redactable and now receives the current fiber Context."
"effect/Inspectable#stringifyCircular":
  replacement: "Formatter.formatJson"
  note: "Use Formatter.formatJson(input, { space: whitespace }); it handles redaction and ancestor cycles."
"effect/Inspectable#toJSON":
  replacement: "Inspectable.toJson"
  note: "Renamed to lower-camel toJson with the same recursive conversion role."
"effect/Inspectable#withRedactableContext":
  replacement: "none"
  note: "Manual FiberRefs scoping was removed; Redactable.redact uses the current fiber Context automatically."
