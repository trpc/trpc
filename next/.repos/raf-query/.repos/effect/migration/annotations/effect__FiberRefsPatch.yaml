effect/FiberRefsPatch#Add:
  replacement: "Context.add"
  note: "FiberRefsPatch was removed; apply Reference overrides directly to Context."
effect/FiberRefsPatch#AndThen:
  replacement: "Context.merge"
  note: "FiberRefsPatch was removed; compose Context updates directly, with later values overriding earlier ones."
effect/FiberRefsPatch#combine:
  replacement: "Context.merge"
  note: "FiberRefsPatch was removed; merge the resulting Context values instead of combining patches."
effect/FiberRefsPatch#diff:
  replacement: "none"
  note: "There is no generic Context diff because FiberRef fork and join patch semantics were removed."
effect/FiberRefsPatch#empty:
  replacement: "Context.empty"
  note: "Use an empty Context when no services or Reference overrides are applied."
effect/FiberRefsPatch#Empty:
  replacement: "Context.Context<never>"
  note: "The empty patch model was removed; an empty Context represents no overrides."
effect/FiberRefsPatch#FiberRefsPatch:
  replacement: "none"
  note: "The patch data type was removed with FiberRefs; construct or merge Context values directly."
effect/FiberRefsPatch#patch:
  replacement: "Context.merge"
  note: "Merge explicit Context overrides into the base Context; FiberId-aware patch application no longer exists."
