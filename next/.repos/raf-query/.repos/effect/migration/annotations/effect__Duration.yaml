"effect/Duration#decode":
  replacement: "Duration.fromInputUnsafe"
  note: "The throwing DurationInput decoder was renamed."
"effect/Duration#decodeUnknown":
  replacement: "Duration.fromInput"
  note: "The safe decoder was renamed and accepts Duration.Input, returning Option<Duration>."
"effect/Duration#Duration":
  replacement: "Duration.Duration"
  note: "The model remains and now also supports negative infinity; its type-id value is private."
"effect/Duration#DurationInput":
  replacement: "Duration.Input"
  note: "The input type was renamed and expanded with negative values and Temporal.Duration-like objects."
"effect/Duration#DurationValue":
  replacement: "Duration.DurationValue"
  note: "The tagged value remains and adds NegativeInfinity; its object fields are no longer readonly."
"effect/Duration#formatIso":
  replacement: "none"
  note: "ISO 8601 duration formatting was removed from the v4 Duration module. The v4 source and migration guides expose no direct replacement; retain a local formatter when this wire format is required."
"effect/Duration#fromIso":
  replacement: "none"
  note: "ISO 8601 duration parsing was removed from the v4 Duration module. The v4 source and migration guides expose no direct replacement; use a dedicated ISO parser and pass the resulting parts to Duration.fromInput."
"effect/Duration#greaterThan":
  replacement: "Duration.isGreaterThan"
  note: "The comparison was renamed with the is prefix."
"effect/Duration#greaterThanOrEqualTo":
  replacement: "Duration.isGreaterThanOrEqualTo"
  note: "The comparison was renamed with the is prefix."
"effect/Duration#lessThan":
  replacement: "Duration.isLessThan"
  note: "The comparison was renamed with the is prefix."
"effect/Duration#lessThanOrEqualTo":
  replacement: "Duration.isLessThanOrEqualTo"
  note: "The comparison was renamed with the is prefix."
"effect/Duration#matchWith":
  replacement: "Duration.matchPair"
  note: "The two-duration matcher was renamed."
"effect/Duration#TypeId":
  replacement: "none"
  note: "The Duration type id is private in v4. Use Duration.isDuration to narrow unknown values."
"effect/Duration#unsafeDivide":
  replacement: "Duration.divideUnsafe"
  note: "The unsafe prefix moved to the end of the division function name."
"effect/Duration#unsafeFormatIso":
  replacement: "none"
  note: "ISO 8601 duration formatting was removed from v4. The v4 Duration exports and migration guides contain no direct unsafe formatter; retain a local formatter if required."
"effect/Duration#unsafeToNanos":
  replacement: "Duration.toNanosUnsafe"
  note: "The unsafe prefix moved to the end of the nanosecond conversion name."
