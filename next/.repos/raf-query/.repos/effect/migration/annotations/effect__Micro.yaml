effect/Micro#void:
  replacement: "Effect.void"
  note: "Micro was removed in v4; the rewritten Effect runtime is itself lightweight and replaces it. Same-name equivalent on effect/Effect."
effect/Micro#when:
  replacement: "Effect.when"
  note: "Micro was removed in v4; the rewritten Effect runtime is itself lightweight and replaces it. Same-name equivalent on effect/Effect."
effect/Micro#whileLoop:
  replacement: "Effect.whileLoop"
  note: "Micro was removed in v4; the rewritten Effect runtime is itself lightweight and replaces it. Same-name equivalent on effect/Effect."
effect/Micro#withConcurrency:
  replacement: "none"
  note: "Removed in v4 along with \"inherit\" concurrency; pass a { concurrency } option directly to each concurrent operation."
  example: "Effect.forEach(items, handle, { concurrency: 10 })"
effect/Micro#withMicroFiber:
  replacement: "Effect.withFiber"
  note: "Renamed: withMicroFiber becomes Effect.withFiber, giving access to the current fiber."
effect/Micro#withTrace:
  replacement: "Effect.withSpan"
  note: "Removed; v4 captures failure stack traces automatically and cause annotations replace the traces array. For named tracing regions use Effect.withSpan."
effect/Micro#YieldableError:
  replacement: "Cause.YieldableError"
  note: "Moved: YieldableError lives in effect/Cause in v4."
effect/Micro#yieldFlush:
  replacement: "none"
  note: "Removed; access the current scheduler via the References.Scheduler service and call its flush() method directly if deterministic draining is needed."
effect/Micro#yieldNow:
  replacement: "Effect.yieldNow"
  note: "Micro was removed in v4; the rewritten Effect runtime is itself lightweight and replaces it. Same-name equivalent on effect/Effect."
