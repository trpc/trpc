"@effect/typeclass/data/Duration#Bounded":
  replacement: "none"
  note: "V4 has no Bounded dictionary; use Duration.Order with Duration.zero and Duration.infinity as separate bounds."
"@effect/typeclass/data/Duration#MonoidMax":
  replacement: "Reducer.make(Duration.max, Duration.zero)"
  note: "Rebuild the removed maximum Monoid as a v4 Reducer with the same identity."
"@effect/typeclass/data/Duration#MonoidMin":
  replacement: "Reducer.make(Duration.min, Duration.infinity)"
  note: "Rebuild the removed minimum Monoid as a v4 Reducer with the same identity."
"@effect/typeclass/data/Duration#MonoidSum":
  replacement: "Duration.ReducerSum"
  note: "Renamed and moved to the concrete v4 Duration module."
"@effect/typeclass/data/Duration#SemigroupMax":
  replacement: "Duration.CombinerMax"
  note: "Renamed and moved to the concrete v4 Duration module."
"@effect/typeclass/data/Duration#SemigroupMin":
  replacement: "Duration.CombinerMin"
  note: "Renamed and moved to the concrete v4 Duration module."
"@effect/typeclass/data/Duration#SemigroupSum":
  replacement: "Duration.ReducerSum"
  note: "The v4 Reducer is also a Combiner and preserves Duration.sum combine semantics."
