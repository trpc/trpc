effect/Cache#Cache:
  replacement: "Cache.Cache"
  note: "The cache model remains, but v4 exposes a Pipeable value with explicit Cache operations and adds a lookup environment parameter."
effect/Cache#Cache.ConsumerVariance:
  replacement: "none"
  note: "The ConsumerCache view and its variance marker were removed; expose a narrower application interface around Cache operations when write access must be hidden."
effect/Cache#Cache.Variance:
  replacement: "none"
  note: "The public variance marker was removed; use Cache.Cache directly and do not depend on its branding internals."
effect/Cache#CacheStats:
  replacement: "none"
  note: "Built-in hit and miss statistics were removed; instrument the lookup and Cache.get calls explicitly, and use Cache.size for the current entry count."
effect/Cache#CacheTypeId:
  replacement: "none"
  note: "The cache type id is internal in v4; do not inspect or construct the cache brand directly."
effect/Cache#ConsumerCache:
  replacement: "Cache.Cache"
  note: "ConsumerCache was removed; use Cache.Cache and expose an application-defined read-only wrapper if capability restriction is required."
effect/Cache#ConsumerCacheTypeId:
  replacement: "none"
  note: "ConsumerCache and its type id were removed with the read-only cache view."
effect/Cache#EntryStats:
  replacement: "none"
  note: "Per-entry loaded-time statistics were removed; record lookup timing in application instrumentation if needed."
effect/Cache#Lookup:
  replacement: "(key: Key) => Effect.Effect<A, E, R>"
  note: "The named alias was removed; use an inline lookup function type or Cache.Cache<Key, A, E, R>[\"lookup\"]."
effect/Cache#makeCacheStats:
  replacement: "none"
  note: "CacheStats and its constructor were removed; define an application metrics record if these counters are still required."
effect/Cache#makeEntryStats:
  replacement: "none"
  note: "EntryStats and its constructor were removed; capture lookup timing in application instrumentation instead."
