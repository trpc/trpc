effect/LogLevel#All:
  replacement: "\"All\""
  note: "V4 levels are string literals rather than branded objects; use the literal as both value and singleton type."
effect/LogLevel#Debug:
  replacement: "\"Debug\""
  note: "V4 levels are string literals rather than branded objects; use the literal as both value and singleton type."
effect/LogLevel#Error:
  replacement: "\"Error\""
  note: "V4 levels are string literals rather than branded objects; use the literal as both value and singleton type."
effect/LogLevel#Fatal:
  replacement: "\"Fatal\""
  note: "V4 levels are string literals rather than branded objects; use the literal as both value and singleton type."
effect/LogLevel#Info:
  replacement: "\"Info\""
  note: "V4 levels are string literals rather than branded objects; use the literal as both value and singleton type."
effect/LogLevel#None:
  replacement: "\"None\""
  note: "V4 levels are string literals rather than branded objects; use the literal as both value and singleton type."
effect/LogLevel#Trace:
  replacement: "\"Trace\""
  note: "V4 levels are string literals rather than branded objects; use the literal as both value and singleton type."
effect/LogLevel#Warning:
  replacement: "\"Warn\""
  note: "V4 renamed both the value and singleton type from Warning to the string literal Warn."
effect/LogLevel#allLevels:
  replacement: "LogLevel.values"
  note: "Use the ordered v4 array of all levels, including All and None."
effect/LogLevel#fromLiteral:
  replacement: "literal === \"Warning\" ? \"Warn\" : literal"
  note: "No constructor is needed because v4 levels are strings. Normalize the renamed Warning literal to Warn; all other v3 literals pass through."
effect/LogLevel#greaterThan:
  replacement: "LogLevel.isGreaterThan"
  note: "Direct rename; ordering remains severity ordering."
effect/LogLevel#greaterThanEqual:
  replacement: "LogLevel.isGreaterThanOrEqualTo"
  note: "Direct rename."
effect/LogLevel#lessThan:
  replacement: "LogLevel.isLessThan"
  note: "Direct rename."
effect/LogLevel#lessThanEqual:
  replacement: "LogLevel.isLessThanOrEqualTo"
  note: "Direct rename."
effect/LogLevel#Literal:
  replacement: "LogLevel.LogLevel"
  note: "This is the all-level replacement after renaming Warning to Warn. LogLevel.Severity is narrower because it excludes All and None."
effect/LogLevel#locally:
  replacement: "Effect.provideService(effect, References.CurrentLogLevel, level)"
  note: "Current log level is now a reference. For threshold configuration, including All or None, provide References.MinimumLogLevel instead."
effect/LogLevel#LogLevel:
  replacement: "LogLevel.LogLevel"
  note: "The name remains, but the representation is a string union and object fields such as _tag, label, syslog, and ordinal are gone. Use toUpperCase() for labels and LogLevel.getOrdinal for ordering."
