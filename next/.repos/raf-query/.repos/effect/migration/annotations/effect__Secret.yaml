"effect/Secret#fromIterable":
  replacement: "Redacted.make(Array.from(iterable).join(\"\"))"
  note: "Secret was removed; join the character iterable and wrap the resulting string in Redacted."
"effect/Secret#isSecret":
  replacement: "Redacted.isRedacted"
  note: "Secret was removed in favor of Redacted."
"effect/Secret#make":
  replacement: "Redacted.make(bytes.map((byte) => String.fromCharCode(byte)).join(\"\"))"
  note: "Secret was removed; preserve the v3 byte-to-code-unit conversion explicitly, then wrap the string in Redacted."
"effect/Secret#Secret":
  replacement: "Redacted.Redacted<string>"
  note: "Secret was deprecated in v3 and removed in v4; use the generic Redacted wrapper."
"effect/Secret#Secret.Proto":
  replacement: "none"
  note: "The Secret-specific prototype was removed with the module; use Redacted.Redacted<string>."
"effect/Secret#SecretTypeId":
  replacement: "Redacted.isRedacted"
  note: "The Secret marker was removed; use the Redacted runtime guard."
"effect/Secret#unsafeWipe":
  replacement: "Redacted.wipeUnsafe"
  note: "Redacted.wipeUnsafe removes the registry entry but, unlike v3 Secret, cannot zero a retained mutable byte array; zero external buffers separately when required."
