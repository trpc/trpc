effect/FiberMap#FiberMap:
  replacement: "FiberMap.FiberMap"
  note: "Retained; contained runtime fibers now use the unified Fiber type."
effect/FiberMap#TypeId:
  replacement: "FiberMap.isFiberMap"
  note: "The type-id symbol is private in v4; use the public guard."
effect/FiberMap#unsafeGet:
  replacement: "FiberMap.getUnsafe"
  note: "Renamed to put the Unsafe suffix last."
effect/FiberMap#unsafeHas:
  replacement: "FiberMap.hasUnsafe"
  note: "Renamed to put the Unsafe suffix last."
effect/FiberMap#unsafeSet:
  replacement: "FiberMap.setUnsafe"
  note: "Renamed to put the Unsafe suffix last; the interruptAs option was removed because IDs are now numeric runtime details."
