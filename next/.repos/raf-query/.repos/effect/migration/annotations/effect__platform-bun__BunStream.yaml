"@effect/platform-bun/BunStream#FromReadableOptions":
  replacement: "Pick<Parameters<typeof BunStream.fromReadable>[0], \"chunkSize\" | \"closeOnDone\">"
  note: "The named interface was inlined into the constructor options; chunkSize is now a number and the full options also contain evaluate and onError. The ignored bufferSize option was removed."
"@effect/platform-bun/BunStream#FromWritableOptions":
  replacement: "Pick<Parameters<typeof BunSink.fromWritable>[0], \"endOnDone\" | \"encoding\">"
  note: "The named interface was inlined into BunSink.fromWritable and duplex constructor options."
"@effect/platform-bun/BunStream#stderr":
  replacement: "stdio.stderr() from Stdio.Stdio"
  note: "Standard error is correctly modeled as a Sink in v4. Explicitly adapt process.stderr with BunStream.fromReadable only to preserve the old unusual read behavior."
"@effect/platform-bun/BunStream#stdin":
  replacement: "stdio.stdin from Stdio.Stdio"
  note: "Standard input moved to the Stdio service; provide BunStdio.layer. Its stream exposes PlatformError instead of dying."
"@effect/platform-bun/BunStream#stdout":
  replacement: "stdio.stdout() from Stdio.Stdio"
  note: "Standard output is correctly modeled as a Sink in v4. Explicitly adapt process.stdout with BunStream.fromReadable only to preserve the old unusual read behavior."
