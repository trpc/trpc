"@effect/platform/PlatformConfigProvider#fromFileTree":
  replacement: "ConfigProvider.fromDir"
  note: "The provider moved into effect/ConfigProvider and was renamed; rootDirectory is now rootPath."
"@effect/platform/PlatformConfigProvider#layerDotEnv":
  replacement: "ConfigProvider.layer(ConfigProvider.fromDotEnv({ path }))"
  note: "Use the v4 dotenv provider effect and install it with ConfigProvider.layer."
"@effect/platform/PlatformConfigProvider#layerDotEnvAdd":
  replacement: "ConfigProvider.layerAdd(ConfigProvider.fromDotEnv({ path }))"
  note: "Use the v4 dotenv provider effect and compose it with ConfigProvider.layerAdd."
"@effect/platform/PlatformConfigProvider#layerFileTree":
  replacement: "ConfigProvider.layer(ConfigProvider.fromDir({ rootPath }))"
  note: "Use the renamed directory-tree provider and install it with ConfigProvider.layer."
"@effect/platform/PlatformConfigProvider#layerFileTreeAdd":
  replacement: "ConfigProvider.layerAdd(ConfigProvider.fromDir({ rootPath }))"
  note: "Use the renamed directory-tree provider and compose it with ConfigProvider.layerAdd."
