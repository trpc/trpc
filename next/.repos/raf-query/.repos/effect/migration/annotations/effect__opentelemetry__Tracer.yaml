"@effect/opentelemetry/Tracer#layer":
  replacement: "OtelTracer.layer"
  note: "The Tracer module was renamed to OtelTracer; this still creates an OpenTelemetry tracer and installs it as Effect's tracer."
"@effect/opentelemetry/Tracer#layerTracer":
  replacement: "OtelTracer.layerTracer"
  note: "The Tracer module was renamed to OtelTracer; this layer still creates only the OpenTelemetry tracer service."
"@effect/opentelemetry/Tracer#make":
  replacement: "OtelTracer.make"
  note: "The constructor remains in the renamed OtelTracer module."
"@effect/opentelemetry/Tracer#OtelTraceFlags":
  replacement: "OtelTracer.OtelTraceFlags"
  note: "The service moved with the module and is now declared as a Context.Service class."
"@effect/opentelemetry/Tracer#OtelTracer":
  replacement: "OtelTracer.OtelTracer"
  note: "The service moved with the renamed module and is now declared as a Context.Service class."
"@effect/opentelemetry/Tracer#OtelTracerProvider":
  replacement: "OtelTracer.OtelTracerProvider"
  note: "The service moved with the renamed module and is now declared as a Context.Service class."
"@effect/opentelemetry/Tracer#OtelTraceState":
  replacement: "OtelTracer.OtelTraceState"
  note: "The service moved with the module and is now declared as a Context.Service class."
