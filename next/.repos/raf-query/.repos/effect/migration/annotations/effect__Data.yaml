"effect/Data#array":
  replacement: "none"
  note: "Use a normal copied array such as [...values]; v4 compares plain arrays structurally."
"effect/Data#case":
  replacement: "none"
  note: "Use an ordinary typed object or identity constructor; plain objects are structurally equal in v4."
"effect/Data#Case":
  replacement: "Data.TaggedEnum.ConstructorFrom"
  note: "The Case namespace was removed; its constructor helper moved under TaggedEnum."
"effect/Data#Case.Constructor":
  replacement: "Data.TaggedEnum.ConstructorFrom"
  note: "Use the v4 tagged-enum constructor-function type."
"effect/Data#struct":
  replacement: "none"
  note: "Use an ordinary object or {...value}; plain objects are structurally equal in v4."
"effect/Data#Structural":
  replacement: "Data.Class"
  note: "Extend Data.Class instead of the removed Structural constructor alias."
"effect/Data#TaggedEnum":
  replacement: "Data.TaggedEnum"
  note: "Still exported with the same record-to-discriminated-union role."
"effect/Data#TaggedEnum.GenericMatchers":
  replacement: "Data.TaggedEnum.GenericMatchers"
  note: "Still exported with $is and $match helpers."
"effect/Data#tuple":
  replacement: "none"
  note: "Use a normal tuple literal; plain tuples are structurally equal in v4."
"effect/Data#unsafeArray":
  replacement: "none"
  note: "Use the array directly; v4 no longer needs prototype mutation for structural equality."
"effect/Data#unsafeStruct":
  replacement: "none"
  note: "Use the object directly; v4 no longer needs prototype mutation for structural equality."
