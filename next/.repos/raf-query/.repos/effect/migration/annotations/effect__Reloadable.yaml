"effect/Reloadable#auto":
  replacement: "LayerRef.Service(..., { layer, invalidationSchedule: schedule, preload: true }).layer"
  note: "Use LayerRef for scheduled refresh; add idleTimeToLive: Duration.infinity to preserve an always-resident instance."
"effect/Reloadable#autoFromConfig":
  replacement: "Layer.unwrap with Effect.contextWith and LayerRef.make"
  note: "Compute the schedule from the current context, then construct a preloaded LayerRef; no config-specific constructor remains."
"effect/Reloadable#get":
  replacement: "ServiceRef.get or Effect.map(ServiceRef.contextEffect, Context.get(Service))"
  note: "LayerRef.get provides the current context as a layer; contextEffect gives scoped direct access."
"effect/Reloadable#manual":
  replacement: "LayerRef.Service(..., { layer, preload: true }).layer"
  note: "Refresh with the generated service's refresh effect; use infinite idleTimeToLive for v3's resident lifecycle."
"effect/Reloadable#reload":
  replacement: "ServiceRef.refresh"
  note: "Refresh invalidates and immediately reacquires; invalidate alone rebuilds on the next borrow."
"effect/Reloadable#Reloadable":
  replacement: "LayerRef.LayerRef<I, E>"
  note: "LayerRef is the v4 refreshable layer-context abstraction."
"effect/Reloadable#Reloadable.Variance":
  replacement: "none"
  note: "The exported variance artifact was removed and LayerRef has no public counterpart."
"effect/Reloadable#ReloadableTypeId":
  replacement: "none"
  note: "Reloadable was removed and LayerRef's marker is private."
"effect/Reloadable#reloadFork":
  replacement: "ServiceRef.refresh.pipe(Effect.ignore({ log: true }), Effect.forkDetach({ startImmediately: true }), Effect.asVoid)"
  note: "This recreates logged, ignored background refresh; forkDaemon became forkDetach."
"effect/Reloadable#tag":
  replacement: "LayerRef.Service<Self>()(id, options)"
  note: "The generated LayerRef service class is itself the Context.Service key."
