"effect/Scope#CloseableScope":
  replacement: "Scope.Closeable"
  note: "Use the renamed type and close it with Scope.close(scope, exit)."
"effect/Scope#CloseableScopeTypeId":
  replacement: "none"
  note: "The closeable-scope marker is private in v4."
"effect/Scope#extend":
  replacement: "Scope.provide"
  note: "The operation was renamed with the same data-first and curried forms."
"effect/Scope#Scope":
  replacement: "Scope.Scope"
  note: "The type remains; use module functions instead of the removed instance methods."
"effect/Scope#Scope.Closeable":
  replacement: "Scope.Closeable"
  note: "The nested alias is now the top-level Closeable interface."
"effect/Scope#Scope.Finalizer":
  replacement: "(exit: Exit.Exit<any, any>) => Effect.Effect<unknown>"
  note: "No alias is exported; inline the Scope.addFinalizerExit callback type."
"effect/Scope#ScopeTypeId":
  replacement: "none"
  note: "The Scope marker is private in v4 and has no public guard."
