"effect/Option#ap":
  replacement: "Option.zipWith"
  note: "Use Option.zipWith(self, that, (f, a) => f(a)); v4 has no Option.ap."
"effect/Option#flatMapNullable":
  replacement: "Option.flatMapNullishOr"
  note: "Renamed with v4 nullish-or terminology."
"effect/Option#fromNullable":
  replacement: "Option.fromNullishOr"
  note: "Renamed with v4 nullish-or terminology."
"effect/Option#getEquivalence":
  replacement: "Option.makeEquivalence"
  note: "Renamed from getEquivalence to makeEquivalence."
"effect/Option#getLeft":
  replacement: "Option.getFailure"
  note: "Either input became Result input, and Left became Failure."
"effect/Option#getOrder":
  replacement: "Option.makeOrder"
  note: "Renamed from getOrder to makeOrder."
"effect/Option#getRight":
  replacement: "Option.getSuccess"
  note: "Either input became Result input, and Right became Success."
"effect/Option#liftNullable":
  replacement: "Option.liftNullishOr"
  note: "Renamed with v4 nullish-or terminology."
"effect/Option#None":
  replacement: "Option.None"
  note: "The variant remains, but Option is no longer an Effect or STM subtype."
"effect/Option#Option":
  replacement: "Option.Option"
  note: "The union type remains, but Option is no longer an Effect or STM subtype."
"effect/Option#OptionUnify":
  replacement: "Option.OptionUnify"
  note: "The unification hook remains under the same name."
"effect/Option#OptionUnifyIgnore":
  replacement: "Option.OptionUnifyIgnore"
  note: "The marker remains, without the v3 Effect, Tag, and Either augmentation fields."
"effect/Option#orElseEither":
  replacement: "Option.orElseResult"
  note: "Either was replaced by Result; source tracking now uses Failure and Success."
"effect/Option#partitionMap":
  include: true
  replacement: "Option.partitionMap"
  note: "The tuple is now [passes, fails], the reverse of v3 [left, right]."
"effect/Option#Some":
  replacement: "Option.Some"
  note: "The variant remains, but Option is no longer an Effect or STM subtype."
"effect/Option#TypeId":
  replacement: "none"
  note: "The v4 Option brand is private and no public TypeId is exported."
