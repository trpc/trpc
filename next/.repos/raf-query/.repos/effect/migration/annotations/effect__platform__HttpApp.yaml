"@effect/platform/HttpApp#currentPreResponseHandlers":
  replacement: "HttpEffect.appendPreResponseHandler / HttpEffect.withPreResponseHandler"
  note: "The FiberRef was removed; register request-local handlers through HttpEffect."
"@effect/platform/HttpApp#Default":
  replacement: "Effect.Effect<HttpServerResponse.HttpServerResponse, E, R | HttpServerRequest.HttpServerRequest>"
  note: "The alias was removed; v4 HTTP applications are ordinary response-producing Effects."
"@effect/platform/HttpApp#ejectDefaultScopeClose":
  replacement: "HttpEffect.scopeDisableClose"
  note: "Renamed; it disables automatic request-scope closure, leaving closure to the caller."
"@effect/platform/HttpApp#HttpApp":
  replacement: "Effect.Effect<A, E, R | HttpServerRequest.HttpServerRequest>"
  note: "The alias was removed; use the underlying Effect type and HttpEffect boundary combinators."
"@effect/platform/HttpApp#toWebHandler":
  replacement: "HttpEffect.toWebHandler"
  note: "Moved to HttpEffect for converting an HTTP effect to a Web handler."
"@effect/platform/HttpApp#toWebHandlerRuntime":
  replacement: "HttpEffect.toWebHandlerWith(context)"
  note: "Runtime was removed in v4; supply a Context with toWebHandlerWith instead."
"@effect/platform/HttpApp#unsafeEjectStreamScope":
  replacement: "HttpEffect.scopeTransferToStream"
  note: "Renamed; it transfers request-scope closure to a streaming response."
