"effect/Chunk#Chunk":
  replacement: "Chunk.Chunk"
  note: "The model remains Chunk.Chunk<A>; continue using Chunk constructors rather than depending on its exposed representation fields."
"effect/Chunk#getEquivalence":
  replacement: "Chunk.makeEquivalence"
  note: "Direct rename; pass the element Equivalence unchanged."
"effect/Chunk#modifyOption":
  replacement: "Chunk.modify"
  note: "The Option suffix was dropped; an out-of-bounds index still returns Option.none."
"effect/Chunk#partition":
  include: true
  replacement: "Chunk.partition"
  note: "Return Result.succeed(value) for a match and Result.fail(value) otherwise; Filter.fromPredicate adapts predicates that only inspect the value. The tuple is now [passes, fails], the reverse of v3 [excluded, satisfying]."
"effect/Chunk#partitionMap":
  replacement: "Chunk.partition"
  note: "Pass a Result-returning mapper instead of Either. The tuple is [passes, fails], the reverse of v3 [failures, successes]."
"effect/Chunk#removeOption":
  replacement: "Chunk.remove"
  note: "The closest API now returns the unchanged Chunk out of bounds; use Chunk.get before Chunk.remove to preserve the old Option result."
"effect/Chunk#replaceOption":
  replacement: "Chunk.replace"
  note: "The Option suffix was dropped; an out-of-bounds index still returns Option.none."
"effect/Chunk#separate":
  include: true
  replacement: "Chunk.separate"
  note: "The tuple is now [successes, failures], the reverse of v3 [failures, successes]."
"effect/Chunk#TypeId":
  replacement: "none"
  note: "The v4 Chunk brand key is private; no public Chunk.TypeId type or value is exported."
"effect/Chunk#unsafeFromArray":
  replacement: "Chunk.fromArrayUnsafe"
  note: "Direct word-order rename; it still wraps without copying and is unsafe if the source array is mutated."
"effect/Chunk#unsafeFromNonEmptyArray":
  replacement: "Chunk.fromNonEmptyArrayUnsafe"
  note: "Direct word-order rename; it still wraps without copying and preserves NonEmptyChunk."
"effect/Chunk#unsafeGet":
  replacement: "Chunk.getUnsafe"
  note: "Direct word-order rename; it still throws for an out-of-bounds index."
"effect/Chunk#unsafeHead":
  replacement: "Chunk.headUnsafe"
  note: "Direct word-order rename; it still throws on an empty Chunk."
"effect/Chunk#unsafeLast":
  replacement: "Chunk.lastUnsafe"
  note: "Direct word-order rename; it still throws on an empty Chunk."
