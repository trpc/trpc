effect/Differ#chunk:
  replacement: "Schema.toDifferJsonPatch"
  note: "Derive a JSON Patch differ from a Schema for the whole Chunk; v4 no longer exposes collection-specific patch constructors."
effect/Differ#combine:
  replacement: "differ.combine"
  note: "Call the combine method on the Differ value directly; the standalone helper was removed."
effect/Differ#diff:
  replacement: "differ.diff"
  note: "Call the diff method on the Differ value directly; the standalone helper was removed."
effect/Differ#Differ:
  replacement: "Differ.Differ"
  note: "The interface remains, but is now an unbranded structural interface and patch takes arguments as patch(oldValue, patch)."
effect/Differ#Differ.Chunk:
  replacement: "JsonPatch.JsonPatch"
  note: "The Chunk patch namespace was removed; Schema.toDifferJsonPatch uses the common RFC 6902 patch representation."
effect/Differ#Differ.Chunk.Patch:
  replacement: "JsonPatch.JsonPatch"
  note: "Use the patch type returned by Schema.toDifferJsonPatch instead of the removed Chunk-specific patch type."
effect/Differ#Differ.Chunk.TypeId:
  replacement: "none"
  note: "Chunk-specific patches and their public brand were removed; do not inspect a patch type id."
effect/Differ#Differ.Context:
  replacement: "Context.Context"
  note: "The Context patch namespace was removed; construct and merge Context values explicitly rather than diffing environments."
effect/Differ#Differ.Context.Patch:
  replacement: "none"
  note: "Context patches were removed; use Context.add, Context.merge, and Context.omit to build the desired Context directly."
effect/Differ#Differ.Context.TypeId:
  replacement: "none"
  note: "Context patches and their public brand were removed."
effect/Differ#Differ.HashMap:
  replacement: "JsonPatch.JsonPatch"
  note: "The HashMap patch namespace was removed; derive a JSON Patch differ from a Schema for the complete value."
effect/Differ#Differ.HashMap.Patch:
  replacement: "JsonPatch.JsonPatch"
  note: "Use the patch type returned by Schema.toDifferJsonPatch instead of the removed HashMap-specific patch type."
effect/Differ#Differ.HashMap.TypeId:
  replacement: "none"
  note: "HashMap-specific patches and their public brand were removed; do not inspect a patch type id."
effect/Differ#Differ.HashSet.Patch:
  replacement: "JsonPatch.JsonPatch"
  note: "Use the patch type returned by Schema.toDifferJsonPatch instead of the removed HashSet-specific patch type."
effect/Differ#Differ.HashSet.TypeId:
  replacement: "none"
  note: "HashSet-specific patches and their public brand were removed; do not inspect a patch type id."
effect/Differ#Differ.Or:
  replacement: "JsonPatch.JsonPatch"
  note: "The Either patch namespace was removed; derive one JSON Patch differ from the Schema for the union value."
effect/Differ#Differ.Or.Patch:
  replacement: "JsonPatch.JsonPatch"
  note: "Use the patch type returned by Schema.toDifferJsonPatch instead of the removed Either-specific patch type."
effect/Differ#Differ.Or.TypeId:
  replacement: "none"
  note: "Either-specific patches and their public brand were removed; do not inspect a patch type id."
effect/Differ#Differ.ReadonlyArray:
  replacement: "JsonPatch.JsonPatch"
  note: "The ReadonlyArray patch namespace was removed; Schema.toDifferJsonPatch uses the common RFC 6902 patch representation."
effect/Differ#Differ.ReadonlyArray.Patch:
  replacement: "JsonPatch.JsonPatch"
  note: "Use the patch type returned by Schema.toDifferJsonPatch instead of the removed ReadonlyArray-specific patch type."
effect/Differ#Differ.ReadonlyArray.TypeId:
  replacement: "none"
  note: "ReadonlyArray-specific patches and their public brand were removed; do not inspect a patch type id."
effect/Differ#empty:
  replacement: "differ.empty"
  note: "Read the empty property from the Differ value directly; the standalone accessor was removed."
effect/Differ#environment:
  replacement: "none"
  note: "The Context differ was removed; construct the target Context explicitly with Context.add, Context.merge, and Context.omit."
effect/Differ#hashMap:
  replacement: "Schema.toDifferJsonPatch"
  note: "Derive a JSON Patch differ from a Schema for the whole map; v4 no longer exposes collection-specific patch constructors."
effect/Differ#hashSet:
  replacement: "Schema.toDifferJsonPatch"
  note: "Derive a JSON Patch differ from a Schema for the whole set; v4 no longer exposes collection-specific patch constructors."
effect/Differ#make:
  replacement: "object literal satisfying Differ.Differ"
  note: "Differ is structural in v4; provide empty, diff, combine, and patch methods directly, with patch(oldValue, patch) argument order."
effect/Differ#orElseEither:
  replacement: "Schema.toDifferJsonPatch"
  note: "Derive one differ from the Schema for the Either value; the compositional Either-specific differ and patch type were removed."
effect/Differ#patch:
  replacement: "differ.patch"
  note: "Call the method directly and reverse the v3 method order: differ.patch(oldValue, patch)."
effect/Differ#readonlyArray:
  replacement: "Schema.toDifferJsonPatch"
  note: "Derive a JSON Patch differ from a Schema for the whole array; v4 no longer exposes collection-specific patch constructors."
effect/Differ#transform:
  replacement: "object literal satisfying Differ.Differ"
  note: "There is no transform combinator; define a structural Differ that maps values before delegating to the original differ."
effect/Differ#TypeId:
  replacement: "none"
  note: "Differ is an unbranded structural interface in v4; do not inspect or implement a public type id."
effect/Differ#update:
  replacement: "object literal satisfying Differ.Differ"
  note: "The update constructor was removed; define empty, diff, combine, and patch directly for function patches, or use Schema.toDifferJsonPatch."
effect/Differ#updateWith:
  replacement: "object literal satisfying Differ.Differ"
  note: "The updateWith constructor was removed; encode the desired merge rule in a structural Differ implementation."
