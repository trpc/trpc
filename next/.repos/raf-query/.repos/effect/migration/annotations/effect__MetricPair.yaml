effect/MetricPair#MetricPair:
  replacement: "Metric.Metric.Snapshot"
  note: "Registry key/state pairs became discriminated snapshots containing id, type, description, attributes, and state."
effect/MetricPair#MetricPair.Untyped:
  replacement: "Metric.Metric.Snapshot"
  note: "Registry key/state pairs became discriminated snapshots containing id, type, description, attributes, and state."
effect/MetricPair#make:
  replacement: "Metric.snapshot"
  note: "There is no pair constructor. Obtain snapshots with Metric.snapshot or Metric.snapshotUnsafe; manually constructed data can satisfy Metric.Metric.SnapshotProto."
effect/MetricPair#unsafeMake:
  replacement: "Metric.snapshot"
  note: "There is no pair constructor. Obtain snapshots with Metric.snapshot or Metric.snapshotUnsafe; manually constructed data can satisfy Metric.Metric.SnapshotProto."
effect/MetricPair#MetricPair.Variance:
  replacement: "none"
  note: "Snapshots are structural, so the pair variance helper and brand symbol were removed."
effect/MetricPair#MetricPairTypeId:
  replacement: "none"
  note: "Snapshots are structural, so the pair variance helper and brand symbol were removed."
