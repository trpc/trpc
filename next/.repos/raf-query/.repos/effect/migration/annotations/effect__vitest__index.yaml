"@effect/vitest/index#WorkerRPC":
  replacement: "none"
  note: "The concrete worker RPC composition is internal. Use public Vitest RuntimeRPC, RunnerRPC, ContextRPC, or WorkerRequest types only when their narrower contract fits."
"@effect/vitest/index#bench":
  replacement: "vitest#test"
  note: "Vitest 5 removes the top-level bench export. Destructure bench from a regular test's context and await bench(name, fn).run(); use skip, only, or todo on the enclosing test."
"@effect/vitest/index#BenchFactory":
  replacement: "vitest#Bench"
  note: "Use the Vitest 5 test-context bench fixture type. It is no longer the tinybench factory constructor."
"@effect/vitest/index#BenchFunction":
  replacement: "vitest#BenchFn"
  note: "Use BenchFn for the callback passed to the Vitest 5 test-context bench fixture."
"@effect/vitest/index#BenchTask":
  replacement: "vitest#BenchRegistration"
  note: "Migrate to a fixture registration and await its run() method; review its fields instead of treating it as a tinybench task."
"@effect/vitest/index#BenchTaskResult":
  replacement: "vitest#BenchResult"
  note: "Use the result returned by awaiting the Vitest 5 fixture registration's run() method."
"@effect/vitest/index#Benchmark":
  replacement: "vitest#TestBenchmark"
  note: "Use TestBenchmark for recorded benchmark data on a test; benchmarks are no longer standalone test tasks."
"@effect/vitest/index#BenchmarkAPI":
  replacement: "vitest#Bench"
  note: "Use the test-context bench fixture. Move skip, only, and todo to the enclosing test."
"@effect/vitest/index#BenchmarkResult":
  replacement: "vitest#BenchResult"
  note: "Use the result returned by awaiting the Vitest 5 fixture registration's run() method; review its changed fields."
"@effect/vitest/index#BenchmarkRunner":
  replacement: "vitest#BenchmarkProvider"
  note: "Vitest 5 runs benchmarks through providers. Export a BenchmarkProvider with an asynchronous run(group) method for a custom engine."
"@effect/vitest/index#ExpectPollOptions":
  replacement: "NonNullable<Parameters<typeof import(\"vitest\").expect.poll>[1]>"
  note: "Vitest 5 removes the named options export; derive the options from the public expect.poll function."
"@effect/vitest/index#Assertion":
  replacement: "vitest#Assertion"
  note: "Vitest 5 takes the matcher return type first. Replace Assertion<T> with Assertion<void, T> or Assertion<Promise<void>, T> for asynchronous assertions."
"@effect/vitest/index#Matchers":
  replacement: "vitest#Matchers"
  note: "Augment vitest.Matchers<R, T> for custom matchers. R is the matcher return type and T is the received value; @vitest/expect no longer shares Vitest's assertion state."
"@effect/vitest/index#it":
  replacement: "@effect/vitest#it"
  note: "Effect helpers retain their calling convention. Vitest 5 removes it.sequential; pass { concurrent: false } to the native test or as the Effect helper's third argument."
"@effect/vitest/index#test":
  replacement: "vitest#test"
  note: "Vitest 5 removes test.sequential and sequential options. Pass { concurrent: false } to opt out of inherited concurrency."
"@effect/vitest/index#describe":
  replacement: "vitest#describe"
  note: "Vitest 5 removes describe.sequential and sequential options. Use describe(name, { concurrent: false }, body) for suites that depend on ordering."
