effect/TDeferred#TDeferred:
  replacement: "TxDeferred.TxDeferred"
  note: "Rename the type and import from \"effect/TxDeferred\". V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TDeferred#TDeferred.Variance:
  replacement: "none"
  note: "TxDeferred exposes no public variance marker."
effect/TDeferred#TDeferredTypeId:
  replacement: "TxDeferred.isTxDeferred"
  note: "The type id is internal in v4; use the public runtime guard."
effect/TDeferred#await:
  replacement: "TxDeferred.await"
  note: "Import TxDeferred from \"effect/TxDeferred\"; the operation keeps its name. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TDeferred#make:
  replacement: "TxDeferred.make"
  note: "Import TxDeferred from \"effect/TxDeferred\"; the operation keeps its name. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
