"@effect/platform/FileSystem#Size":
  replacement: "ByteSize.ByteSize"
  note: "Use ByteSize.bytes or unit constructors for file sizes. Truncation lengths, buffer sizes, and read/write counts use number. File.seek takes and returns signed bigint positions; it can fail with PlatformError, including BadArgument when seeking before the start."
"@effect/platform/FileSystem#SizeInput":
  replacement: "ByteSize.Input"
  note: "File-size and path-backed range inputs use ByteSize.Input. String inputs must be non-negative decimal integers without leading zeros, followed by a canonical unit symbol or lowercase unit name, with at most one separating space. Parse external strings or fractional quantities with ByteSize.fromString (Option) or ByteSize.fromStringUnsafe (throws), then pass the resulting ByteSize. Truncation lengths, Web File ranges, and buffer sizes use number."
"@effect/platform/FileSystem#StreamOptions":
  replacement: "NonNullable<Parameters<FileSystem.FileSystem[\"stream\"]>[1]>"
  note: "Stream options are inline; bufferSize was removed, bytesToRead and offset accept ByteSize inputs, and chunkSize uses number."
