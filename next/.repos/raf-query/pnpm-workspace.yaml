packages:
  - "www"
  - "www/samples/*"
  - "examples/*"
  - "examples/.shared/*"
  - "packages/*"
  - ".experimental/*/*"
  - "tooling/*"

# `pnpm <script>` installs first when node_modules is out of date with the lockfile.
verifyDepsBeforeRun: install

catalog:
  "@effect/platform-node": 4.0.1
  "@effect/vitest": 4.0.1
  effect: ^4.0.1

minimumReleaseAgeExclude:
  - happy-dom@21.0.1
  - "@base-ui/react@1.9.0"
  - svelte-check@4.7.7

# Keep plugins such as @effect/vitest on the Vitest copy bundled by vite-plus.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest@*: 5.0.1

peerDependencyRules:
  allowedVersions:
    vite: 1.0.0
