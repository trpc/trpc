"@effect/platform-node-shared/NodeTerminal#make":
  include: true
  replacement: "NodeTerminal.make"
  note: "V4 ends key input on bare Esc as well as Ctrl+C and Ctrl+D. Pass a custom shouldQuit predicate to make if your application needs to receive Esc; the v3 default quit only on Ctrl+C and Ctrl+D."
"@effect/platform-node-shared/NodeTerminal#layer":
  include: true
  replacement: "NodeTerminal.layer"
  note: "The default layer now ends key input on bare Esc as well as Ctrl+C and Ctrl+D. To keep Esc as input, build a layer with Layer.effect(Terminal.Terminal, NodeTerminal.make(shouldQuit)) using a custom quit predicate."
