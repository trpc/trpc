packages:
  - 'packages/*'
  - 'examples/*'
  - 'test/*'
  - 'spikes'
  - 'tooling/*'

minimumReleaseAgeExclude:
  - vendor-src@0.16.0
  - '@orpc/client@2.0.0-beta.44'
  - '@orpc/contract@2.0.0-beta.44'
  - '@orpc/server@2.0.0-beta.44'
  - '@orpc/shared@2.0.0-beta.44'

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest@*: 5.0.3

peerDependencyRules:
  allowedVersions:
    vite: '1.1.0'

allowBuilds:
  esbuild: true
  vue-demi: true
  workerd: true
