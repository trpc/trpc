packages:
  - 'packages/*'
  - 'examples/*'
  - 'test/*'
  - 'spikes'
  - 'tooling/*'

minimumReleaseAgeExclude:
  - vendor-src@0.15.4

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest@*: 5.0.3

peerDependencyRules:
  allowedVersions:
    vite: '1.1.0'

allowBuilds:
  esbuild: true
  vue-demi: true
  workerd: true
