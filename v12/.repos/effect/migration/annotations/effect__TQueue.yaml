effect/TQueue#BaseTQueue:
  replacement: "TxQueue.TxQueueState"
  note: "The shared queue state model was renamed and now includes the richer open, closing, and done lifecycle."
effect/TQueue#TDequeue:
  replacement: "TxQueue.TxDequeue"
  note: "Rename the read-side type; it now carries an error channel."
effect/TQueue#TDequeueTypeId:
  replacement: "TxQueue.isTxDequeue"
  note: "The type id is internal in v4; use the public runtime guard."
effect/TQueue#TEnqueue:
  replacement: "TxQueue.TxEnqueue"
  note: "Rename the write-side type; it now carries an error channel."
effect/TQueue#TEnqueueTypeId:
  replacement: "TxQueue.isTxEnqueue"
  note: "The type id is internal in v4; use the public runtime guard."
effect/TQueue#TQueue:
  replacement: "TxQueue.TxQueue"
  note: "Rename the type; it now carries an error channel and completion lifecycle. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TQueue#TQueue.TDequeueVariance:
  replacement: "TxQueue.TxDequeue.Variance"
  note: "The read-side variance marker moved under TxDequeue and now includes the error type."
effect/TQueue#TQueue.TEnqueueVariance:
  replacement: "TxQueue.TxEnqueue.Variance"
  note: "The write-side variance marker moved under TxEnqueue and now includes the error type."
effect/TQueue#bounded:
  replacement: "TxQueue.bounded"
  note: "Import TxQueue from \"effect/TxQueue\"; the operation keeps its name. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TQueue#capacity:
  replacement: "queue.capacity"
  note: "Capacity is now a property on TxQueue handles rather than a module function."
effect/TQueue#dropping:
  replacement: "TxQueue.dropping"
  note: "Import TxQueue from \"effect/TxQueue\"; the operation keeps its name. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
