  note: "Import TxQueue from \"effect/TxQueue\"; the operation keeps its name. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TQueue#isTDequeue:
  replacement: "TxQueue.isTxDequeue"
  note: "The runtime guard was renamed with the TxDequeue type."
effect/TQueue#isTEnqueue:
  replacement: "TxQueue.isTxEnqueue"
  note: "The runtime guard was renamed with the TxEnqueue type."
effect/TQueue#isTQueue:
  replacement: "TxQueue.isTxQueue"
  note: "The runtime guard was renamed with the TxQueue type."
effect/TQueue#offerAll:
  replacement: "TxQueue.offerAll"
  note: "The operation remains, but now returns rejected elements rather than a boolean."
effect/TQueue#peek:
  replacement: "TxQueue.peek"
  note: "Import TxQueue from \"effect/TxQueue\"; the operation keeps its name. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TQueue#poll:
  replacement: "TxQueue.poll"
  note: "Import TxQueue from \"effect/TxQueue\"; the operation keeps its name. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TQueue#seek:
