"@effect/platform/HttpRouter#all":
  replacement: "HttpRouter.add(\"*\", path, handler, options)"
  note: "v4 registers a route layer instead of returning an immutable router."
"@effect/platform/HttpRouter#append":
  replacement: "HttpRouter.addAll([route])"
  note: "Register the route and merge its layer with other route layers."
"@effect/platform/HttpRouter#catchAll":
  replacement: "HttpRouter.middleware + Effect.catch"
  note: "Apply typed-error recovery in route middleware provided to route layers."
"@effect/platform/HttpRouter#catchAllCause":
  replacement: "HttpRouter.middleware + Effect.catchCause"
  note: "Apply cause recovery in route middleware provided to route layers."
"@effect/platform/HttpRouter#catchTag":
  replacement: "HttpRouter.middleware + Effect.catchTag"
  note: "Apply tagged-error recovery in route middleware provided to route layers."
"@effect/platform/HttpRouter#concat":
  replacement: "Layer.merge"
  note: "Routers are now route-registration layers; merge the two layers."
"@effect/platform/HttpRouter#concatAll":
  replacement: "Layer.mergeAll"
  note: "Routers are now route-registration layers; merge all layers."
"@effect/platform/HttpRouter#currentRouterConfig":
  replacement: "HttpRouter.RouterConfig"
  note: "The FiberRef became a Context.Reference containing Partial<FindMyWay.RouterConfig>."
"@effect/platform/HttpRouter#Default":
  replacement: "HttpRouter.HttpRouter + HttpRouter.layer"
  note: "Custom/default router tags were removed; v4 provides one router service."
"@effect/platform/HttpRouter#empty":
  replacement: "Layer.empty"
  note: "There is no immutable empty router; use an empty registration layer."
"@effect/platform/HttpRouter#fromIterable":
  replacement: "HttpRouter.addAll(Array.from(routes))"
  note: "Materialize and register the route descriptors as a layer."
"@effect/platform/HttpRouter#get":
  replacement: "HttpRouter.add(\"GET\", path, handler, options)"
  note: "Register a route layer; handlers must produce HttpServerResponse."
"@effect/platform/HttpRouter#head":
  replacement: "HttpRouter.addAll([HttpRouter.route(\"HEAD\", path, handler, options)])"
  note: "Use route plus addAll because add does not expose HEAD."
"@effect/platform/HttpRouter#HttpRouter":
  replacement: "HttpRouter.HttpRouter"
  note: "The name remains, but now denotes the mutable layer-oriented registration service."
"@effect/platform/HttpRouter#HttpRouter.DefaultServices":
  replacement: "none"
  note: "The custom tagged-router default-service bundle was removed."
"@effect/platform/HttpRouter#HttpRouter.Service":
  replacement: "HttpRouter.HttpRouter"
  note: "Use the consolidated router service interface."
"@effect/platform/HttpRouter#makeRoute":
  replacement: "HttpRouter.route"
  note: "Renamed to route; v4 route options no longer expose the old prefix field."
"@effect/platform/HttpRouter#mount":
  replacement: "HttpRouter.addAll(routes, { prefix: path })"
  note: "Register child routes with a prefix, or use router.prefixed(path)."
"@effect/platform/HttpRouter#mountApp":
  replacement: "HttpRouter.use((router) => router.prefixed(path).add(\"*\", \"/*\", app))"
  note: "Register the app on the prefixed router service; no direct mount API remains."
"@effect/platform/HttpRouter#options":
  replacement: "HttpRouter.add(\"OPTIONS\", path, handler, options)"
  note: "Register a route layer; handlers must produce HttpServerResponse."
"@effect/platform/HttpRouter#patch":
  replacement: "HttpRouter.add(\"PATCH\", path, handler, options)"
  note: "Register a route layer; handlers must produce HttpServerResponse."
"@effect/platform/HttpRouter#PathInput":
  replacement: "HttpRouter.PathInput"
  note: "Retained as an absolute slash path or wildcard."
"@effect/platform/HttpRouter#post":
  replacement: "HttpRouter.add(\"POST\", path, handler, options)"
  note: "Register a route layer; handlers must produce HttpServerResponse."
"@effect/platform/HttpRouter#prefixAll":
  replacement: "HttpRouter.addAll(routes, { prefix })"
  note: "Apply the prefix while registering route descriptors."
"@effect/platform/HttpRouter#put":
  replacement: "HttpRouter.add(\"PUT\", path, handler, options)"
  note: "Register a route layer; handlers must produce HttpServerResponse."
"@effect/platform/HttpRouter#Route.Middleware":
  replacement: "Effect.Effect"
  note: "Spell the route response Effect directly, or use HttpRouter.middleware for transforms."
"@effect/platform/HttpRouter#RouteContextTypeId":
  replacement: "none"
  note: "The nominal id is internal in v4; access HttpRouter.RouteContext as a service."
"@effect/platform/HttpRouter#RouteTypeId":
  replacement: "none"
  note: "The nominal id is internal in v4; construct routes with HttpRouter.route."
"@effect/platform/HttpRouter#setRouterConfig":
  replacement: "Layer.succeed(HttpRouter.RouterConfig)(config)"
  note: "Provide the RouterConfig Context.Reference as a layer."
"@effect/platform/HttpRouter#Tag":
  replacement: "none"
  note: "Custom router tags were removed; use the singleton router service and registration layers."
"@effect/platform/HttpRouter#toHttpApp":
  replacement: "HttpRouter.toHttpEffect"
  note: "Pass the route-registration layer to build the server handler effect."
"@effect/platform/HttpRouter#transform":
  replacement: "HttpRouter.middleware"
  note: "Express the route-wide response Effect transform as router middleware."
"@effect/platform/HttpRouter#TypeId":
  replacement: "none"
  note: "The router nominal service id is internal in v4; use HttpRouter.HttpRouter."
"@effect/platform/HttpRouter#withRouterConfig":
  replacement: "Effect.provideService(effect, HttpRouter.RouterConfig, config)"
  note: "Provide the RouterConfig Context.Reference locally instead of setting a FiberRef."
