effect/MetricKeyType#summary:
  replacement: "Metric.summary"
  note: "The standalone descriptor was folded into the complete Metric.summary constructor."
effect/MetricKeyType#MetricKeyType:
  replacement: "Metric.Metric"
  note: "Input/state typing and kind configuration now live on the complete Metric<Input, State>."
effect/MetricKeyType#MetricKeyType.InType:
  replacement: "Metric.Metric.Input"
  note: "Use Metric.Metric.Input<M> to extract a metric's input type."
effect/MetricKeyType#MetricKeyType.OutType:
  replacement: "Metric.Metric.State"
  note: "Use Metric.Metric.State<M> to extract a metric's state type."
effect/MetricKeyType#MetricKeyType.Untyped:
  replacement: "Metric.Metric<any, any>"
  note: "The key-type descriptor no longer exists independently of a metric."
effect/MetricKeyType#MetricKeyType.Variance:
  replacement: "none"
  note: "The descriptor variance interface was removed; complete Metric carries Input and State variance."
effect/MetricKeyType#isMetricKeyType:
  replacement: "Metric.isMetric"
  note: "Standalone key-type values were removed; test complete metrics instead."
effect/MetricKeyType#isCounterKey:
  replacement: "Metric.isMetric + metric.type"
  note: "Standalone refinements were removed. Complete metrics expose a Counter, Frequency, Gauge, Histogram, or Summary string discriminant."
