effect/RequestBlock#empty:
  replacement: "Effect.void"
  note: "RequestBlock was removed; represent an empty computation as Effect.void and let Effect.request perform batching."
effect/RequestBlock#Empty:
  replacement: "none"
  note: "The public blocked-request graph was removed; application code should compose Effect.request computations instead of inspecting Empty nodes."
effect/RequestBlock#mapRequestResolvers:
  replacement: "Effect.request"
  note: "Pass the selected resolver to each Effect.request call; the runtime request graph can no longer be traversed to rewrite resolvers."
effect/RequestBlock#Par:
  replacement: "none"
  note: "The public blocked-request graph was removed; express parallel request execution with Effect concurrency combinators."
effect/RequestBlock#parallel:
  replacement: "Effect.all"
  note: "Compose request effects with Effect.all and explicit concurrency; v4 batching is performed by resolver and batch key rather than RequestBlock nodes."
effect/RequestBlock#reduce:
  replacement: "none"
  note: "The public blocked-request graph and reducer were removed; structure analysis is now internal to the request runtime."
effect/RequestBlock#RequestBlock:
  replacement: "none"
  note: "RequestBlock is no longer public in v4; compose Effect.request values directly and let the runtime batch requests by resolver."
effect/RequestBlock#Seq:
  replacement: "none"
  note: "The public blocked-request graph was removed; express sequencing in the Effect program instead of constructing Seq nodes."
effect/RequestBlock#sequential:
  replacement: "Effect.andThen"
  note: "Sequence request effects with Effect.andThen, flatMap, or generator syntax; RequestBlock sequencing nodes were removed."
effect/RequestBlock#single:
  replacement: "Effect.request"
  note: "Construct the request effect directly with its Request value and RequestResolver; the runtime creates pending entries internally."
