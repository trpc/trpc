effect/Queue#awaitShutdown:
  replacement: "Queue.await"
  note: "Queue completion now includes normal end and failure; Queue.await waits for Done and propagates non-Done terminal causes."
effect/Queue#BackingQueue:
  replacement: "none"
  note: "Custom backing queues were removed by the v4 Queue rewrite; use Queue.make and its built-in capacity and strategy options."
effect/Queue#BackingQueueTypeId:
  replacement: "none"
  note: "BackingQueue and its public type id were removed."
effect/Queue#backPressureStrategy:
  replacement: "Queue.make({ strategy: \"suspend\" })"
  note: "Strategies are now constructor options rather than public Strategy values; suspend is the default."
effect/Queue#BaseQueue:
  replacement: "Queue.Enqueue | Queue.Dequeue"
  note: "The shared BaseQueue interface was removed; accept the required enqueue or dequeue capability and call Queue operations explicitly."
effect/Queue#capacity:
  replacement: "queue.capacity"
  note: "Capacity is now a property on Queue.Enqueue and Queue.Dequeue rather than a module function."
effect/Queue#Dequeue:
  replacement: "Queue.Dequeue"
  note: "The model remains and gains an error parameter, but is no longer an Effect subtype; use Queue.take explicitly."
effect/Queue#DequeueTypeId:
  replacement: "Queue.isDequeue"
  note: "The dequeue type id is internal in v4; use Queue.isDequeue for runtime refinement."
effect/Queue#DequeueUnify:
  replacement: "none"
  note: "Queue.Dequeue is no longer an Effect subtype, so its Effect unification helper was removed."
effect/Queue#DequeueUnifyIgnore:
  replacement: "none"
  note: "Queue.Dequeue is no longer an Effect subtype, so its Effect unification ignore marker was removed."
effect/Queue#droppingStrategy:
  replacement: "Queue.make({ strategy: \"dropping\" })"
  note: "Strategies are now constructor options rather than public Strategy values; Queue.dropping is the bounded convenience constructor."
effect/Queue#Enqueue:
  replacement: "Queue.Enqueue"
  note: "The write-side model remains, gains an error parameter, and is operated through Queue.offer and related functions."
effect/Queue#EnqueueTypeId:
  replacement: "Queue.isEnqueue"
  note: "The enqueue type id is internal in v4; use Queue.isEnqueue for runtime refinement."
effect/Queue#isEmpty:
  replacement: "Effect.map(Queue.size(self), (size) => size === 0)"
  note: "The dedicated helper was removed; derive emptiness from Queue.size."
effect/Queue#Queue:
  replacement: "Queue.Queue"
  note: "The model remains, gains an error parameter and completion signaling, and is no longer an Effect subtype; use Queue.take explicitly."
effect/Queue#Queue.BackingQueueVariance:
  replacement: "none"
  note: "BackingQueue and its variance marker were removed by the v4 Queue rewrite."
effect/Queue#Queue.DequeueVariance:
  replacement: "Queue.Dequeue.Variance"
  note: "The read-side variance marker moved under the Queue.Dequeue namespace and now includes the error type."
effect/Queue#Queue.EnqueueVariance:
  replacement: "Queue.Enqueue.Variance"
  note: "The write-side variance marker moved under the Queue.Enqueue namespace and now includes the error type."
effect/Queue#Queue.StrategyVariance:
  replacement: "none"
  note: "Public Strategy values and their variance marker were removed; select a string strategy when constructing the Queue."
effect/Queue#QueueStrategyTypeId:
  replacement: "none"
  note: "Public Strategy values and their type id were removed."
effect/Queue#QueueUnify:
  replacement: "none"
  note: "Queue is no longer an Effect subtype, so its Effect unification helper was removed; call Queue.take explicitly."
effect/Queue#QueueUnifyIgnore:
  replacement: "none"
  note: "Queue is no longer an Effect subtype, so its Effect unification ignore marker was removed."
effect/Queue#slidingStrategy:
  replacement: "Queue.make({ strategy: \"sliding\" })"
  note: "Strategies are now constructor options rather than public Strategy values; Queue.sliding is the bounded convenience constructor."
effect/Queue#Strategy:
  replacement: "\"suspend\" | \"dropping\" | \"sliding\""
  note: "The pluggable Strategy interface was removed; choose one of the built-in strategy strings in Queue.make."
effect/Queue#takeUpTo:
  replacement: "Queue.poll"
  note: "No direct bounded batch helper remains; repeatedly call non-blocking Queue.poll up to the limit, or use Queue.clear when taking every buffered value is acceptable."
effect/Queue#unsafeOffer:
  replacement: "Queue.offerUnsafe"
  note: "The unsafe suffix moved to the end."
effect/Queue#isShutdown:
  replacement: "queue.state._tag === \"Done\""
  note: "The dedicated helper was removed; inspect the public queue lifecycle state. Done includes normal completion and failure, not only explicit shutdown."
