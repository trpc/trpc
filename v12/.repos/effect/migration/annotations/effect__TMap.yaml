effect/TMap#TMap:
  replacement: "TxHashMap.TxHashMap"
  note: "Rename the type and import from \"effect/TxHashMap\". V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TMap#TMap.Variance:
  replacement: "none"
  note: "TxHashMap exposes no public variance marker."
