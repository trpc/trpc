effect/MetricPolling#MetricPolling:
  replacement: "local { metric, poll } record"
  note: "The module was removed. Keep a local record pairing a Metric with its polling Effect when this abstraction is still useful."
effect/MetricPolling#make:
  replacement: "({ metric, poll })"
  note: "No public constructor remains; use the local record directly."
effect/MetricPolling#poll:
  replacement: "self.poll"
  note: "Access the polling Effect from the local record."
effect/MetricPolling#pollAndUpdate:
  replacement: "Effect.flatMap(self.poll, input => Metric.update(self.metric, input))"
  note: "Compose polling and metric update directly."
effect/MetricPolling#retry:
  replacement: "Effect.retry"
  note: "Retry the poll Effect and retain the same metric in the local record."
effect/MetricPolling#launch:
  replacement: "Effect.repeat + Effect.forkScoped"
  note: "Repeat polling, updating, and reading with the schedule, then forkScoped."
effect/MetricPolling#collectAll:
  replacement: "Effect.forEach + Metric.update/value"
  note: "No combined metric replacement exists. Poll records, update each metric, and collect states explicitly."
effect/MetricPolling#MetricPollingTypeId:
  replacement: "none"
  note: "The polling wrapper and its brand were removed."
