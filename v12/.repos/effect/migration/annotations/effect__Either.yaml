"effect/Either#all":
  replacement: "Result.all"
  note: "Either moved to Result; collection behavior is retained with Failure and Success terminology."
"effect/Either#ap":
  replacement: "Result.flatMap"
  note: "Use Result.flatMap(self, (f) => Result.map(that, f)); v4 has no Result.ap."
"effect/Either#bind":
  replacement: "Result.bind"
  note: "The do-notation combinator moved to Result."
"effect/Either#bindTo":
  replacement: "Result.bindTo"
  note: "The do-notation combinator moved to Result."
"effect/Either#Do":
  replacement: "Result.Do"
  note: "The empty successful do-notation value moved to Result."
"effect/Either#Either":
  replacement: "Result.Result"
  note: "Either<A, E> became Result<A, E>; Right and Left became Success and Failure."
"effect/Either#Either.Left":
  replacement: "Result.Result.Failure"
  note: "Use the Result namespace extractor for the failure variant."
"effect/Either#Either.Right":
  replacement: "Result.Result.Success"
  note: "Use the Result namespace extractor for the success variant."
"effect/Either#EitherTypeLambda":
  replacement: "Result.ResultTypeLambda"
  note: "Moved and renamed with Result."
"effect/Either#EitherUnify":
  replacement: "Result.ResultUnify"
  note: "Moved and renamed with Result."
"effect/Either#EitherUnifyIgnore":
  replacement: "Result.ResultUnifyIgnore"
  note: "Moved and renamed with Result."
"effect/Either#filterOrLeft":
  replacement: "Result.filterOrFail"
  note: "Left is now Failure, so the predicate combinator is filterOrFail."
"effect/Either#flip":
  replacement: "Result.flip"
  note: "The channel-swapping combinator moved to Result."
"effect/Either#fromNullable":
  replacement: "Result.fromNullishOr"
  note: "Renamed with v4 nullish-or terminology."
"effect/Either#getEquivalence":
  replacement: "Result.makeEquivalence"
  note: "Pass success and failure equivalences positionally instead of a right and left object."
"effect/Either#getLeft":
  replacement: "Result.getFailure"
  note: "Extract the Result failure as an Option."
"effect/Either#getOrElse":
  replacement: "Result.getOrElse"
  note: "Moved unchanged to Result."
"effect/Either#getOrThrow":
  replacement: "Result.getOrThrow"
  note: "V4 throws the raw Failure value; use getOrThrowWith when a custom Error is required."
"effect/Either#getOrThrowWith":
  replacement: "Result.getOrThrowWith"
  note: "Moved to Result; the callback receives the Failure value."
"effect/Either#getOrUndefined":
  replacement: "Result.getOrUndefined"
  note: "Moved unchanged to Result."
"effect/Either#getRight":
  replacement: "Result.getSuccess"
  note: "Extract the Result success as an Option."
"effect/Either#isEither":
  replacement: "Result.isResult"
  note: "Renamed with the data type."
"effect/Either#isLeft":
  replacement: "Result.isFailure"
  note: "Left is now the Failure variant."
"effect/Either#isRight":
  replacement: "Result.isSuccess"
  note: "Right is now the Success variant."
"effect/Either#left":
  replacement: "Result.fail"
  note: "Construct a Failure with Result.fail."
"effect/Either#Left":
  replacement: "Result.Failure"
  note: "Left became Failure; .left became .failure."
"effect/Either#let":
  replacement: "Result.let"
  note: "The do-notation combinator moved to Result."
"effect/Either#map":
  replacement: "Result.map"
  note: "Map now transforms the Success channel."
"effect/Either#mapLeft":
  replacement: "Result.mapError"
  note: "Left mapping became failure-channel error mapping."
"effect/Either#match":
  replacement: "Result.match"
  note: "Rename handlers from onLeft and onRight to onFailure and onSuccess."
"effect/Either#right":
  replacement: "Result.succeed"
  note: "Construct a Success with Result.succeed."
"effect/Either#Right":
  replacement: "Result.Success"
  note: "Right became Success; .right became .success."
"effect/Either#try":
  replacement: "Result.try"
  note: "The synchronous throwable constructor moved to Result."
"effect/Either#TypeId":
  replacement: "none"
  note: "Result keeps its brand private and exports no public TypeId."
"effect/Either#void":
  replacement: "Result.void"
  note: "Use the prebuilt successful Result<void>."
