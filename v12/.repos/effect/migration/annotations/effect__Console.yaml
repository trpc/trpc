effect/Console#Console:
  replacement: "Console.Console"
  note: "Name retained, but v4 is a Context.Reference whose service methods are synchronous. Rewrite custom implementations from effectful methods plus .unsafe to direct console methods; module accessors such as Console.log still return Effect values."
effect/Console#setConsole:
  replacement: "Layer.succeed(Console.Console, console)"
  note: "Provide the v4 console reference as a layer."
effect/Console#TypeId:
  replacement: "none"
  note: "The public console brand was removed; v4 Console.Console is structural."
effect/Console#UnsafeConsole:
  replacement: "Console.Console"
  note: "The v4 service interface is the old unsafe/direct interface; .unsafe no longer exists."
effect/Console#withConsole:
  replacement: "Effect.provideService(effect, Console.Console, console)"
  note: "Console overrides now use the reference/service provider pattern."
effect/Console#withGroup:
  replacement: "Console.withGroup"
  note: "The API and data-first/data-last behavior remain."
effect/Console#withTime:
  replacement: "Console.withTime"
  note: "The API and data-first/data-last behavior remain."
