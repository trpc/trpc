effect/Supervisor#AbstractSupervisor:
  replacement: "none"
  note: "The ambient Supervisor abstraction and runtime event hooks were removed."
effect/Supervisor#addSupervisor:
  replacement: "none"
  note: "Layer-installed ambient supervision was removed; use structured concurrency and explicit FiberSet or FiberMap tracking."
effect/Supervisor#fibersIn:
  replacement: "FiberSet"
  note: "Use a scoped FiberSet and explicitly run or add fibers; it does not ambiently observe every descendant."
effect/Supervisor#fromEffect:
  replacement: "none"
  note: "The Supervisor abstraction and its effect-valued observation hook were removed."
effect/Supervisor#none:
  replacement: "none"
  note: "The Supervisor abstraction was removed; normal structured concurrency needs no no-op supervisor."
effect/Supervisor#Supervisor:
  replacement: "none"
  note: "Ambient fiber supervision was removed; use structured concurrency or explicit FiberSet and FiberMap tracking."
effect/Supervisor#Supervisor.Variance:
  replacement: "none"
  note: "The Supervisor abstraction and its variance marker were removed."
effect/Supervisor#SupervisorTypeId:
  replacement: "none"
  note: "The Supervisor abstraction and its type identifier were removed."
effect/Supervisor#unsafeTrack:
  replacement: "FiberSet"
  note: "Use scoped FiberSet.make and explicitly run or add fibers; there is no unsafe unscoped ambient tracker."
