effect/STM#filterNot:
  replacement: "Effect.filter"
  note: "Negate the effectful predicate result and use Effect.filter."
effect/STM#filterOrDie:
  replacement: "Effect.filterOrFail + Effect.orDie"
  note: "Fail with the lazy defect when the predicate rejects, then convert that failure to a defect."
effect/STM#filterOrDieMessage:
  replacement: "Effect.filterOrFail + Effect.orDie"
  note: "Fail with a new Error carrying the message when the predicate rejects, then convert it to a defect."
effect/STM#filterOrFail:
  replacement: "Effect.filterOrFail"
