  note: "The dedicated helper was removed; map the error into Option.some."
effect/STM#asVoid:
  replacement: "Effect.asVoid"
  note: "The combinator keeps its name, but STM values are now ordinary Effects. Run the complete transaction with Effect.tx. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/STM#attempt:
  replacement: "Effect.try"
  note: "The constructor was renamed; transaction programs are ordinary Effects in v4."
effect/STM#bind:
  replacement: "Effect.bind"
  note: "The combinator keeps its name, but STM values are now ordinary Effects. Run the complete transaction with Effect.tx. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
