effect/STM#Adapter:
  replacement: "none"
  note: "The STM.gen adapter was removed; Effect.gen accepts yielded Effects directly."
effect/STM#All.IsDiscard:
  replacement: "Effect.All.IsDiscard"
  note: "The helper moved to Effect.All because STM.all is now Effect.all."
effect/STM#All.Narrow:
  replacement: "none"
  note: "Effect.all uses a const generic directly, so the separate tuple-narrowing helper was removed."
effect/STM#All.Options:
  replacement: "none"
  note: "Effect.all inlines its options type; use its concurrency, discard, and mode options directly."
effect/STM#All.STMAny:
  replacement: "Effect.All.EffectAny"
  note: "STM inputs are ordinary Effects in v4, so use the Effect.All helper."
effect/STM#All.Signature:
  replacement: "typeof Effect.all"
  note: "The named STM all signature was removed; refer to Effect.all directly."
effect/STM#Do:
  replacement: "Effect.Do"
  note: "The combinator keeps its name, but STM values are now ordinary Effects. Run the complete transaction with Effect.tx. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/STM#STM:
  replacement: "Effect.Effect"
  note: "The distinct STM instruction type was removed. Tx APIs return Effect values; wrap the complete transaction in Effect.tx."
effect/STM#STM.Variance:
  replacement: "Effect.Variance"
  note: "The distinct STM variance marker was removed with STM; use the Effect marker."
effect/STM#STMTypeId:
  replacement: "Effect.TypeId"
  note: "The distinct STM type id was removed because transactions are represented by Effect values."
effect/STM#STMTypeLambda:
  replacement: "Effect.EffectTypeLambda"
  note: "Use the Effect type lambda; transactional requirements are represented by Effect.Transaction."
effect/STM#STMUnify:
  replacement: "Effect.EffectUnify"
  note: "STM unification moved to ordinary Effect unification."
effect/STM#STMUnifyIgnore:
  replacement: "none"
  note: "The STM-specific unification ignore marker was removed; rely on Effect inference."
effect/STM#acquireUseRelease:
  replacement: "Effect.acquireUseRelease + Effect.tx"
  note: "Wrap acquire, use, and release in separate Effect.tx calls to preserve the v3 separately committed phases; v4 release also receives the use Exit."
effect/STM#all:
  replacement: "Effect.all"
  note: "The combinator keeps its name, but STM values are now ordinary Effects. Run the complete transaction with Effect.tx. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
