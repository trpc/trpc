effect/STM#catchAll:
  replacement: "Effect.catch"
  note: "Use Effect.catch for typed failures. It does not catch Effect.txRetry or restore a transactional savepoint."
effect/STM#catchSome:
  replacement: "Effect.catch + Option.match"
  note: "Use Effect.catch and re-fail the original error when the partial handler returns None."
effect/STM#catchTag:
  replacement: "Effect.catchTag"
  note: "The combinator keeps its name, but STM values are now ordinary Effects. Run the complete transaction with Effect.tx. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/STM#check:
  replacement: "Effect.suspend + Effect.txRetry"
  note: "Evaluate the predicate lazily and return Effect.void when true or Effect.txRetry when false, inside Effect.tx."
effect/STM#collect:
  replacement: "Effect.flatMap + Option.match + Effect.txRetry"
  note: "Map Some to success and None to Effect.txRetry inside the surrounding Effect.tx transaction."
effect/STM#collectSTM:
  replacement: "Effect.flatMap + Option.match + Effect.txRetry"
  note: "Return the Effect held by Some and use Effect.txRetry for None, inside the surrounding Effect.tx transaction."
effect/STM#commit:
