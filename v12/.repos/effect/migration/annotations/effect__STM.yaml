  note: "Effect.tx runs an Effect transaction and removes its Effect.Transaction requirement."
effect/STM#commitEither:
  replacement: "Effect.tx + Effect.result + Effect.fromResult"
  note: "Run Effect.tx(Effect.result(body)) before Effect.fromResult so journal changes commit even when the original transaction had a typed failure."
effect/STM#cond:
  replacement: "Effect.suspend"
  note: "Lazily branch to Effect.succeed or Effect.fail based on the predicate."
effect/STM#context:
  replacement: "Effect.context"
  note: "The combinator keeps its name, but STM values are now ordinary Effects. Run the complete transaction with Effect.tx. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/STM#contextWith:
