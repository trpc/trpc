"effect/Context#Context":
  replacement: "Context.Context<Services>"
  note: "The type remains; unsafeMap is now mapUnsafe and v4 also exposes mutable."
"effect/Context#GenericTag":
  replacement: "Context.Service<T>(id)"
  note: "Use the function-style Context.Service constructor."
"effect/Context#isTag":
  replacement: "Context.isKey"
  note: "The service-key guard was renamed."
"effect/Context#ReadonlyTag":
  replacement: "Context.Key<Identifier, Shape>"
  note: "Use the renamed service-key interface."
"effect/Context#Reference":
  replacement: "Context.Reference<Shape>"
  note: "Use Context.Reference<Shape>(id, { defaultValue }); the identifier type parameter was removed."
"effect/Context#ReferenceClass":
  replacement: "Context.Reference<Shape>(id, { defaultValue })"
  note: "Replace reference subclasses with a constant created by Context.Reference."
"effect/Context#ReferenceTypeId":
  replacement: "none"
  note: "The marker is private in v4; use Context.isReference for runtime discrimination."
"effect/Context#Tag":
  replacement: "Context.Service"
  note: "Use Context.Service<T>(id), or Context.Service<Self, Shape>()(id) for class syntax."
"effect/Context#Tag.Service":
  replacement: "Context.Service.Shape<T>"
  note: "The namespace type helper was renamed with Tag."
"effect/Context#TagClass":
  replacement: "Context.ServiceClass<Self, Id, Shape>"
  note: "Use the renamed class-style service-key type."
"effect/Context#TagClassShape":
  replacement: "Context.ServiceClass.Shape<Id, Shape>"
  note: "Use the renamed namespace type helper."
"effect/Context#TagTypeId":
  replacement: "Context.ServiceTypeId"
  note: "The public type identifier was renamed with Tag."
"effect/Context#TagUnify":
  replacement: "none"
  note: "The Context-specific unification hook was removed; Context.Key already extends Effect."
"effect/Context#TagUnifyIgnore":
  replacement: "none"
  note: "The Context-specific Unify-ignore artifact was removed."
"effect/Context#TypeId":
  replacement: "none"
  note: "The Context marker is private in v4; use Context.isContext for runtime checks."
"effect/Context#unsafeGet":
  replacement: "Context.getUnsafe"
  note: "The unsafe getter was renamed."
"effect/Context#unsafeMake":
  replacement: "Context.makeUnsafe"
  note: "The unsafe constructor was renamed and accepts a ReadonlyMap."
"effect/Context#ValidTagsById":
  replacement: "<I extends R, S>(key: Context.Key<I, S>)"
  note: "The alias was removed; express the Context.Key constraint directly."
