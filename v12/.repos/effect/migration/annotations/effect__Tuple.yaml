"effect/Tuple#at":
  replacement: "Tuple.get"
  note: "Renamed for indexed access; v4 constrains the index to a valid tuple position."
"effect/Tuple#getEquivalence":
  replacement: "Tuple.makeEquivalence"
  note: "Pass equivalences as one array instead of variadic arguments."
"effect/Tuple#getFirst":
  replacement: "Tuple.get(0)"
  note: "Use Tuple.get(self, 0), or Tuple.get(0) in a pipe."
"effect/Tuple#getOrder":
  replacement: "Tuple.makeOrder"
  note: "Pass orders as one array instead of variadic arguments."
"effect/Tuple#getSecond":
  replacement: "Tuple.get(1)"
  note: "Use Tuple.get(self, 1), or Tuple.get(1) in a pipe."
"effect/Tuple#mapBoth":
  replacement: "Tuple.evolve"
  note: "Use Tuple.evolve(self, [options.onFirst, options.onSecond])."
"effect/Tuple#mapFirst":
  replacement: "Tuple.evolve"
  note: "Use Tuple.evolve(self, [f]); unspecified positions are preserved."
"effect/Tuple#mapSecond":
  replacement: "Tuple.evolve"
  note: "Use Tuple.evolve(self, [undefined, f]); undefined preserves the first position."
"effect/Tuple#swap":
  replacement: "Tuple.renameIndices"
  note: "Swap a pair with Tuple.renameIndices(self, [\"1\", \"0\"])."
"effect/Tuple#TupleTypeLambda":
  replacement: "none"
  note: "Removed with tuple Bicovariant support; use the concrete tuple type or a local HKT TypeLambda."
