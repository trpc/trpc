"effect/Subscribable#isSubscribable":
  replacement: "none"
  note: "The common brand was removed; use a concrete guard such as SubscriptionRef.isSubscriptionRef or an application structural guard."
"effect/Subscribable#make":
  replacement: "object literal { get, changes }"
  note: "No generic constructor remains; retain a local structural pair only when both the current read and change stream are needed."
"effect/Subscribable#map":
  replacement: "Effect.map + Stream.map"
  note: "For a retained get and changes pair, map the Effect and Stream separately."
"effect/Subscribable#mapEffect":
  replacement: "Effect.flatMap + Stream.mapEffect"
  note: "For a retained get and changes pair, flatMap the Effect and mapEffect the Stream separately."
"effect/Subscribable#Subscribable":
  replacement: "custom { readonly get: Effect.Effect<A, E, R>; readonly changes: Stream.Stream<A, E, R> }"
  note: "No renamed generic model exists; prefer concrete SubscriptionRef APIs or own this unbranded structural type locally."
"effect/Subscribable#TypeId":
  replacement: "none"
  note: "The Subscribable brand has no public replacement; use a concrete model guard or an application structural guard."
"effect/Subscribable#unwrap":
  replacement: "Effect.flatMap + Stream.unwrap"
  note: "Build get with Effect.flatMap and changes with Stream.unwrap; no single v4 helper remains."
