"effect/ManagedRuntime#ManagedRuntime":
  replacement: "ManagedRuntime.ManagedRuntime"
  note: "The handle remains but is no longer an Effect; runtimeEffect/runtime became contextEffect/context, and make accepts { memoMap }."
"effect/ManagedRuntime#ManagedRuntime.Context":
  replacement: "ManagedRuntime.ManagedRuntime.Services<T>"
  note: "The context extractor was renamed to Services."
"effect/ManagedRuntime#ManagedRuntimeUnify":
  replacement: "none"
  note: "ManagedRuntime no longer extends Effect, so its unification artifact was removed; call run methods or contextEffect explicitly."
"effect/ManagedRuntime#ManagedRuntimeUnifyIgnore":
  replacement: "none"
  note: "ManagedRuntime no longer extends Effect, so the Unify-ignore artifact was removed."
"effect/ManagedRuntime#TypeId":
  replacement: "ManagedRuntime.isManagedRuntime"
  note: "The marker is private; use the public guard for runtime narrowing."
