"effect/Iterable#flatMapNullable":
  replacement: "Iterable.flatMapNullishOr"
  note: "Direct nullish-terminology rename; it remains lazy and drops null or undefined mapper results."
"effect/Iterable#getLefts":
  replacement: "Iterable.getFailures"
  note: "Either became Result; this lazily extracts failure payloads."
"effect/Iterable#getRights":
  replacement: "Iterable.getSuccesses"
  note: "Either became Result; this lazily extracts success payloads."
"effect/Iterable#unsafeHead":
  replacement: "Iterable.headUnsafe"
  note: "Direct word-order rename; it still throws on an empty Iterable."
