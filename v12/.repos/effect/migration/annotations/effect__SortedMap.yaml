"effect/SortedMap#empty":
  replacement: "HashMap.empty"
  note: "SortedMap was removed; use an immutable HashMap and retain the key Order separately."
"effect/SortedMap#entries":
  replacement: "HashMap.entries + Array.sortWith"
  note: "Materialize HashMap.entries and sort by key with the retained Order when ordered traversal is required."
"effect/SortedMap#fromIterable":
  replacement: "HashMap.fromIterable"
  note: "Use HashMap.fromIterable and retain the key Order separately; duplicate keys collapse."
"effect/SortedMap#get":
  replacement: "HashMap.get"
  note: "Direct optional lookup on the replacement immutable map."
"effect/SortedMap#getOrder":
  replacement: "none"
  note: "HashMap does not store an Order; retain and pass the key Order explicitly."
"effect/SortedMap#headOption":
  replacement: "HashMap.entries + Array.sortWith + Array.head"
  note: "Sort entries by key with the retained Order, then take the optional first entry."
"effect/SortedMap#isEmpty":
  replacement: "HashMap.isEmpty"
  note: "Direct emptiness check on the replacement immutable map."
"effect/SortedMap#isNonEmpty":
  replacement: "HashMap.isEmpty"
  note: "Use !HashMap.isEmpty(self); no dedicated HashMap.isNonEmpty helper exists."
"effect/SortedMap#isSortedMap":
  replacement: "HashMap.isHashMap"
  note: "Use the replacement model guard; it does not prove that observations were sorted."
"effect/SortedMap#keys":
  replacement: "HashMap.entries + Array.sortWith + Array.map"
  note: "Sort entries by key, map to keys, and iterate the resulting array."
"effect/SortedMap#lastOption":
  replacement: "HashMap.entries + Array.sortWith + Array.last"
  note: "Sort entries by key with the retained Order, then take the optional last entry."
"effect/SortedMap#make":
  replacement: "HashMap.make"
  note: "Remove the outer order-curried constructor and pass entries directly to HashMap.make."
"effect/SortedMap#map":
  replacement: "HashMap.map"
  note: "The value-and-key callback remains, but result iteration is unordered until explicitly sorted."
"effect/SortedMap#partition":
  replacement: "HashMap.filter"
  note: "Build [excluded, satisfying] with complementary HashMap.filter calls; adapt the callback to the old key predicate."
"effect/SortedMap#remove":
  replacement: "HashMap.remove"
  note: "Direct persistent removal; explicitly sort only when observing entries."
"effect/SortedMap#set":
  replacement: "HashMap.set"
  note: "Direct persistent insert or update; explicitly sort only when observing entries."
"effect/SortedMap#size":
  replacement: "HashMap.size"
  note: "Direct size query on the replacement immutable map."
"effect/SortedMap#SortedMap":
  replacement: "HashMap.HashMap"
  note: "Use HashMap as the immutable core model and retain Order externally; ordered iteration and range seeks require sorting on observation."
"effect/SortedMap#TypeId":
  replacement: "none"
  note: "The SortedMap brand was removed and HashMap.TypeId is private; use HashMap.isHashMap when a guard is needed."
"effect/SortedMap#values":
  replacement: "HashMap.entries + Array.sortWith + Array.map"
  note: "Sort entries by key, map to values, and iterate the resulting array."
"effect/SortedMap#has":
  replacement: "HashMap.has"
  note: "Use direct membership testing on the replacement HashMap; retain the key Order separately for sorted observations."
"effect/SortedMap#reduce":
  replacement: "HashMap.reduce"
  note: "Reduce the replacement HashMap, but explicitly sort entries first if the old key-order traversal affected the result."
