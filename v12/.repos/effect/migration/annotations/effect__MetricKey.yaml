effect/MetricKey#counter:
  replacement: "Metric.counter"
  note: "The key and key type were merged into the complete Metric.counter constructor."
effect/MetricKey#frequency:
  replacement: "Metric.frequency"
  note: "The key and key type were merged into the complete Metric.frequency constructor."
effect/MetricKey#gauge:
  replacement: "Metric.gauge"
  note: "The key and key type were merged into the complete Metric.gauge constructor."
effect/MetricKey#histogram:
  replacement: "Metric.histogram"
  note: "The key and key type were merged into the complete Metric.histogram constructor."
effect/MetricKey#summary:
  replacement: "Metric.summary"
  note: "The key and key type were merged into the complete Metric.summary constructor."
effect/MetricKey#MetricKey:
  replacement: "Metric.Metric"
  note: "Key identity, metadata, and operations are combined in Metric<Input, State>."
effect/MetricKey#MetricKey.Untyped:
  replacement: "Metric.Metric<any, any>"
  note: "The separate untyped key alias was removed; use an untyped complete Metric only where required."
effect/MetricKey#MetricKey.Variance:
  replacement: "Metric.Metric"
  note: "There is no separate key variance interface; variance is carried by Metric's Input and State phantom fields."
effect/MetricKey#isMetricKey:
  replacement: "Metric.isMetric"
  note: "Keys became complete metrics; use the complete-metric runtime guard."
effect/MetricKey#MetricKeyTypeId:
  replacement: "none"
  note: "The key brand was removed; Metric's protocol key is internal."
effect/MetricKey#taggedWithLabels:
  replacement: "Metric.withAttributes"
  note: "Labels became attributes. Pass a string record or array of string tuples."
