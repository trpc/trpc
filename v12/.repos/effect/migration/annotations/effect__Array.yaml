"effect/Array#filterMapWhile":
  replacement: "Array.takeWhileFilter"
  note: "Same map-until-first-miss behavior; change the callback from Option.some/none to Result.succeed/fail."
"effect/Array#flatMapNullable":
  replacement: "Array.flatMapNullishOr"
  note: "Direct nullish-terminology rename; null and undefined mapper results are still discarded."
"effect/Array#fromNullable":
  replacement: "Array.fromNullishOr"
  note: "Direct nullish-terminology rename; null and undefined become an empty array and other values become a singleton."
"effect/Array#getEquivalence":
  replacement: "Array.makeEquivalence"
  note: "Direct rename; pass the element Equivalence unchanged."
"effect/Array#getLefts":
  replacement: "Array.getFailures"
  note: "Either became Result; this extracts failure payloads in input order."
"effect/Array#getOrder":
  replacement: "Array.makeOrder"
  note: "Direct rename; pass the element Order unchanged."
"effect/Array#getRights":
  replacement: "Array.getSuccesses"
  note: "Either became Result; this extracts success payloads in input order."
"effect/Array#init":
  replacement: "Array.init"
  note: "The API and Option<Array<A>> behavior remain unchanged."
"effect/Array#isEmptyArray":
  replacement: "Array.isArrayEmpty"
  note: "Direct word-order rename; retains the mutable empty-array type guard."
"effect/Array#isEmptyReadonlyArray":
  replacement: "Array.isReadonlyArrayEmpty"
  note: "Direct word-order rename; retains the readonly empty-array type guard."
"effect/Array#isNonEmptyArray":
  replacement: "Array.isArrayNonEmpty"
  note: "Direct word-order rename; retains the mutable NonEmptyArray type guard."
"effect/Array#isNonEmptyReadonlyArray":
  replacement: "Array.isReadonlyArrayNonEmpty"
  note: "Direct word-order rename; retains the NonEmptyReadonlyArray type guard."
"effect/Array#liftEither":
  replacement: "Array.liftResult"
  note: "Either became Result; failures produce an empty array and successes produce a singleton."
"effect/Array#liftNullable":
  replacement: "Array.liftNullishOr"
  note: "Direct nullish-terminology rename; the lifted function still returns zero or one element."
"effect/Array#modifyNonEmptyHead":
  replacement: "Array.modifyHeadNonEmpty"
  note: "Direct word-order rename with the same non-empty-preserving result."
"effect/Array#modifyNonEmptyLast":
  replacement: "Array.modifyLastNonEmpty"
  note: "Direct word-order rename with the same non-empty-preserving result."
"effect/Array#modifyOption":
  replacement: "Array.modify"
  note: "The Option suffix was dropped; an out-of-bounds index still returns Option.none."
"effect/Array#partition":
  include: true
  replacement: "Array.partition"
  note: "Return Result.succeed(value) for a match and Result.fail(value) otherwise; Filter.fromPredicate adapts predicates that only inspect the value. The tuple is now [passes, fails], the reverse of v3 [excluded, satisfying]."
"effect/Array#partitionMap":
  replacement: "Array.partition"
  note: "Pass a Result-returning mapper instead of Either. The tuple is [passes, fails], the reverse of v3 [lefts, rights]."
"effect/Array#ReadonlyArray":
  replacement: "Array.ReadonlyArray"
  note: "The namespace and its Infer, With, OrNonEmpty, AndNonEmpty, and Flatten utility types remain."
"effect/Array#removeOption":
  replacement: "Array.remove"
  note: "The closest API now returns an unchanged copy out of bounds; use Array.get before Array.remove to preserve the old Option result."
"effect/Array#replaceOption":
  replacement: "Array.replace"
  note: "The Option suffix was dropped; an out-of-bounds index still returns Option.none."
"effect/Array#separate":
  include: true
  replacement: "Array.separate"
  note: "The tuple is now [successes, failures], the reverse of v3 [lefts, rights]."
"effect/Array#setNonEmptyHead":
  replacement: "Array.setHeadNonEmpty"
  note: "Direct word-order rename with the same non-empty-preserving result."
"effect/Array#setNonEmptyLast":
  replacement: "Array.setLastNonEmpty"
  note: "Direct word-order rename with the same non-empty-preserving result."
"effect/Array#splitNonEmptyAt":
  replacement: "Array.splitAtNonEmpty"
  note: "Direct word-order rename; the left output remains guaranteed non-empty."
"effect/Array#tail":
  replacement: "Array.tail"
  note: "The API and Option<Array<A>> behavior remain unchanged."
"effect/Array#unsafeGet":
  replacement: "Array.getUnsafe"
  note: "Direct word-order rename; it still throws for an out-of-bounds index."
