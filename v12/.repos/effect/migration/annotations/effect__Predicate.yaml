"effect/Predicate#all":
  replacement: "Predicate.Tuple(Array.from(collection))"
  note: "Use positional Tuple, materializing an Iterable when needed. V4 checks every configured position instead of accepting missing input values."
"effect/Predicate#every":
  replacement: "Predicate.every"
  note: "Retained with the same AND semantics, short-circuiting, and true result for an empty collection."
"effect/Predicate#isBigInt":
  replacement: "Predicate.isBigInt"
  note: "Retained with the same bigint refinement."
"effect/Predicate#isBoolean":
  replacement: "Predicate.isBoolean"
  note: "Retained with the same boolean refinement."
"effect/Predicate#isDate":
  replacement: "Predicate.isDate"
  note: "Retained with the same instanceof Date check."
"effect/Predicate#isError":
  replacement: "Predicate.isError"
  note: "Retained with the same instanceof Error check."
"effect/Predicate#isFunction":
  replacement: "Predicate.isFunction"
  note: "Retained with the same function refinement."
"effect/Predicate#isIterable":
  replacement: "Predicate.isIterable"
  note: "Retained; strings and values exposing Symbol.iterator are still accepted."
"effect/Predicate#isMap":
  replacement: "Predicate.isMap"
  note: "Retained with the same instanceof Map check."
"effect/Predicate#isNever":
  replacement: "Predicate.isNever"
  note: "Retained as the always-false refinement."
"effect/Predicate#isNotNull":
  replacement: "Predicate.isNotNull"
  note: "Retained; undefined still passes while null is excluded."
"effect/Predicate#isNotNullable":
  replacement: "Predicate.isNotNullish"
  note: "Renamed to use nullish terminology; it still excludes null and undefined."
"effect/Predicate#isNotUndefined":
  replacement: "Predicate.isNotUndefined"
  note: "Retained; null still passes while undefined is excluded."
"effect/Predicate#isNull":
  replacement: "Predicate.isNull"
  note: "Retained with the same strict null refinement."
"effect/Predicate#isNullable":
  replacement: "Predicate.isNullish"
  note: "Renamed to use nullish terminology. The guard now narrows with A & (null | undefined), including unknown inputs correctly."
"effect/Predicate#isNumber":
  replacement: "Predicate.isNumber"
  note: "Retained; NaN and infinite numbers still pass."
"effect/Predicate#isObject":
  replacement: "Predicate.isObjectKeyword"
  note: "Use isObjectKeyword to preserve v3 behavior accepting arrays and functions. V4 isObject has the former record-like semantics instead."
"effect/Predicate#isPromise":
  replacement: "Predicate.isPromise"
  note: "Retained as the structural check for callable then and catch properties."
"effect/Predicate#isPromiseLike":
  replacement: "Predicate.isPromiseLike"
  note: "Retained as the structural check for a callable then property."
"effect/Predicate#isReadonlyRecord":
  replacement: "Predicate.isReadonlyObject"
  note: "Renamed; runtime behavior is unchanged and the index-key type now explicitly includes numbers."
"effect/Predicate#isRecord":
  replacement: "Predicate.isObject"
  note: "Renamed; it still accepts non-null, non-array objects and now narrows with PropertyKey indexes."
"effect/Predicate#isRegExp":
  replacement: "Predicate.isRegExp"
  note: "Retained with the same instanceof RegExp check."
"effect/Predicate#isSet":
  replacement: "Predicate.isSet"
  note: "Retained with the same instanceof Set check."
"effect/Predicate#isString":
  replacement: "Predicate.isString"
  note: "Retained with the same primitive string refinement."
"effect/Predicate#isSymbol":
  replacement: "Predicate.isSymbol"
  note: "Retained with the same symbol refinement."
"effect/Predicate#isTruthy":
  replacement: "Predicate.isTruthy"
  note: "Retained as a plain boolean predicate using JavaScript truthiness."
"effect/Predicate#isUint8Array":
  replacement: "Predicate.isUint8Array"
  note: "Retained with the same instanceof Uint8Array check."
"effect/Predicate#isUndefined":
  replacement: "Predicate.isUndefined"
  note: "Retained with the same strict undefined refinement."
"effect/Predicate#isUnknown":
  replacement: "Predicate.isUnknown"
  note: "Retained as the always-true refinement."
"effect/Predicate#not":
  replacement: "Predicate.not"
  note: "Retained with the same boolean negation; refinements still become plain predicates."
"effect/Predicate#Predicate":
  replacement: "Predicate.Predicate"
  note: "The callable interface is retained. Predicate.Any now uses any rather than never, which can affect generic inference."
"effect/Predicate#product":
  replacement: "Predicate.Tuple([self, that])"
  note: "Replace the two-position product helper with the Tuple constructor."
"effect/Predicate#productMany":
  replacement: "Predicate.Tuple([self, ...Array.from(collection)])"
  note: "Materialize the predicate iterable in one Tuple call; v4 checks missing tail positions as undefined."
"effect/Predicate#Refinement":
  replacement: "Predicate.Refinement"
  note: "The refinement interface and its In, Out, and Any namespace types are retained."
"effect/Predicate#some":
  replacement: "Predicate.some"
  note: "Retained with the same OR semantics, short-circuiting, and false result for an empty collection."
"effect/Predicate#struct":
  replacement: "Predicate.Struct"
  note: "Capitalized constructor name; field checks and refinement-aware typing are retained."
"effect/Predicate#tuple":
  replacement: "Predicate.Tuple([p1, p2, ...])"
  note: "Capitalized constructor now takes one predicate array instead of rest arguments and checks missing positions as undefined."
