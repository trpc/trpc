"effect/Ordering#combineAll":
  replacement: "Ordering.Reducer.combineAll"
  note: "The combination operation moved to the exported Reducer; first-nonzero and empty-input behavior are unchanged."
"effect/Ordering#combineMany":
  replacement: "Ordering.Reducer.combineAll(Iterable.prepend(collection, self))"
  note: "Prepend the initial ordering before reducing to preserve v3 short-circuiting without consuming collection when self is nonzero."
