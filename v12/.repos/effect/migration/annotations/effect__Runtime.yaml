effect/Runtime#AsyncFiberException:
  replacement: "Cause.AsyncFiberError"
  note: "The error thrown when synchronous execution encounters an async boundary was renamed."
effect/Runtime#Cancel:
  replacement: "ReturnType<typeof Effect.runCallback>"
  note: "Use the cancellation function returned by runCallback; the named type was removed."
effect/Runtime#defaultRuntime:
  replacement: "Context.empty()"
  note: "Runtime values were removed; call Effect.run* directly or use an empty Context with an Effect.run*With function."
effect/Runtime#defaultRuntimeFlags:
  replacement: "none"
  note: "Runtime flags were removed; configure scheduler yielding, interruptibility, and runtime metrics independently."
effect/Runtime#deleteFiberRef:
  replacement: "Context.omit"
  note: "FiberRefs became Context.Reference values; omit the Reference override from the Context."
effect/Runtime#disableRuntimeFlag:
  replacement: "none"
  note: "Runtime flags were removed; disable the corresponding scheduler, interruptibility, or metric behavior directly."
effect/Runtime#enableRuntimeFlag:
  replacement: "none"
  note: "Runtime flags were removed; enable the corresponding scheduler, interruptibility, or metric behavior directly."
effect/Runtime#FiberFailure:
  replacement: "none"
  note: "The runner error wrapper was removed; use an Exit-returning runner to retain and inspect a structured Cause."
effect/Runtime#FiberFailureCauseId:
  replacement: "none"
  note: "The FiberFailure wrapper and its cause marker were removed; inspect Cause through Exit instead."
effect/Runtime#FiberFailureId:
  replacement: "none"
  note: "The FiberFailure wrapper and its brand were removed; inspect Cause through Exit instead."
effect/Runtime#isAsyncFiberException:
  replacement: "Cause.isAsyncFiberError"
  note: "Use the renamed guard from Cause."
effect/Runtime#isFiberFailure:
  replacement: "none"
  note: "FiberFailure no longer exists; use an Exit-returning runner and inspect Exit or Cause."
effect/Runtime#make:
  replacement: "Context.make"
  note: "Runtime values were removed; construct the service Context passed to Effect.run*With instead."
effect/Runtime#makeFiberFailure:
  replacement: "Cause.squash"
  note: "Use Cause.squash only when a Cause must become the value thrown or rejected by a runner."
effect/Runtime#runCallback:
  replacement: "Effect.runCallbackWith"
  note: "Run with the former Runtime's Context; use Effect.runCallback when no services are required."
effect/Runtime#RunCallbackOptions:
  replacement: "Effect.RunOptions & { readonly onExit: (exit: Exit.Exit<unknown, unknown>) => void }"
  note: "The callback runner now combines Effect.RunOptions with an onExit callback; no named options type is exported."
effect/Runtime#runFork:
  replacement: "Effect.runForkWith"
  note: "Run with the former Runtime's Context; use Effect.runFork when no services are required."
effect/Runtime#RunForkOptions:
  replacement: "Effect.RunOptions"
  note: "Use common runner options; express scoped forking with Effect.forkIn or Effect.forkScoped."
effect/Runtime#runPromise:
  replacement: "Effect.runPromiseWith"
  note: "Run with the former Runtime's Context; use Effect.runPromise when no services are required."
effect/Runtime#runPromiseExit:
  replacement: "Effect.runPromiseExitWith"
  note: "Run with the former Runtime's Context; use Effect.runPromiseExit when no services are required."
effect/Runtime#runSync:
  replacement: "Effect.runSyncWith"
  note: "Run with the former Runtime's Context; use Effect.runSync when no services are required."
effect/Runtime#runSyncExit:
  replacement: "Effect.runSyncExitWith"
  note: "Run with the former Runtime's Context; use Effect.runSyncExit when no services are required."
effect/Runtime#Runtime:
  replacement: "Context.Context"
  note: "Runtime values were removed; carry a Context and invoke the corresponding Effect.run*With function."
effect/Runtime#Runtime.Context:
  replacement: "none"
  note: "The Runtime context extractor was removed; carry the service union directly on Context.Context."
effect/Runtime#setFiberRef:
  replacement: "Context.add"
  note: "FiberRefs became Context.Reference values; add the Reference override to the Context."
effect/Runtime#updateFiberRefs:
  replacement: "Context.add"
  note: "There is no aggregate FiberRefs update; add targeted Context.Reference overrides to the carried Context explicitly."
effect/Runtime#updateContext:
  replacement: "Context transformation + Effect.run*With"
  note: "Runtime values were removed; transform the carried Context directly, then pass the result to the corresponding Effect.run*With function."
effect/Runtime#updateRuntimeFlags:
  replacement: "none"
  note: "Runtime flags and aggregate patches were removed; configure each semantic behavior independently."
