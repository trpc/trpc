effect/ExecutionStrategy#ExecutionStrategy:
  replacement: "Types.Concurrency | Scope.ExecutionStrategy"
  note: "The ADT was removed; use number | unbounded for operation concurrency, or sequential | parallel for Scope finalizers."
effect/ExecutionStrategy#isParallel:
  replacement: "strategy === \"parallel\""
  note: "Compare the Scope strategy directly; for concurrency options compare with unbounded."
effect/ExecutionStrategy#isParallelN:
  replacement: "typeof concurrency === \"number\""
  note: "Bounded parallelism is represented directly by a numeric concurrency value."
effect/ExecutionStrategy#isSequential:
  replacement: "strategy === \"sequential\""
  note: "Compare the Scope strategy directly; for operation concurrency use the value 1."
effect/ExecutionStrategy#match:
  replacement: "switch"
  note: "Use ordinary branching over the consumer-specific concurrency or Scope strategy primitive."
effect/ExecutionStrategy#parallel:
  replacement: "\"parallel\" | \"unbounded\""
  note: "Use parallel for Scope finalizers or unbounded for operation concurrency."
effect/ExecutionStrategy#Parallel:
  replacement: "\"parallel\" | \"unbounded\""
  note: "The tagged case was removed; use the consumer-specific primitive value."
effect/ExecutionStrategy#parallelN:
  replacement: "number"
  note: "Pass the parallelism directly as a numeric concurrency option; Scope has no bounded parallel strategy."
effect/ExecutionStrategy#ParallelN:
  replacement: "number"
  note: "The tagged case was removed; bounded operation concurrency is represented directly by a number."
effect/ExecutionStrategy#sequential:
  replacement: "\"sequential\" | 1"
  note: "Use sequential for Scope finalizers or 1 for operation concurrency."
effect/ExecutionStrategy#Sequential:
  replacement: "\"sequential\" | 1"
  note: "The tagged case was removed; use the consumer-specific primitive value."
