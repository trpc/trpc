"@effect/platform/HttpServerRequest#fromWeb":
  replacement: "HttpServerRequest.fromWeb"
  note: "Retained for wrapping a Web Request."
"@effect/platform/HttpServerRequest#ParsedSearchParams":
  replacement: "HttpServerRequest.ParsedSearchParams"
  note: "The marker and tag became one Context.Service class."
"@effect/platform/HttpServerRequest#persistedMultipart":
  replacement: "HttpServerRequest.HttpServerRequest.use((request) => request.multipart)"
  note: "Use the request service's `.use` helper to return its cached multipart effect."
"@effect/platform/HttpServerRequest#schemaBodyJson":
  replacement: "HttpServerRequest.schemaBodyJson"
  note: "Retained with v4 Schema constraints and error types."
"@effect/platform/HttpServerRequest#schemaBodyUrlParams":
  replacement: "HttpServerRequest.schemaBodyUrlParams"
  note: "Retained with ConstraintCodec input and v4 error types."
"@effect/platform/HttpServerRequest#schemaHeaders":
  replacement: "HttpServerRequest.schemaHeaders"
  note: "Retained with ConstraintCodec input and SchemaError failures."
"@effect/platform/HttpServerRequest#toWeb":
  replacement: "HttpServerRequest.toWeb"
  note: "Retained and captures the current Context for streamed bodies."
"@effect/platform/HttpServerRequest#toWebEither":
  replacement: "HttpServerRequest.toWebResult"
  note: "Either became Result, and the optional Runtime became an optional Context."
"@effect/platform/HttpServerRequest#TypeId":
  replacement: "typeof HttpServerRequest.TypeId"
  note: "TypeId remains public but is now a string constant; use typeof in type position."
"@effect/platform/HttpServerRequest#upgrade":
  replacement: "HttpServerRequest.HttpServerRequest.use((request) => request.upgrade)"
  note: "The top-level accessor was removed; read upgrade from the request service. It fails with HttpServerError instead of RequestError. HttpServerRequest.upgradeChannel remains for channel-based WebSocket handling."
"@effect/platform/HttpServerRequest#HttpServerRequest":
  include: true
  replacement: "HttpServerRequest.HttpServerRequest"
  note: "Custom implementations must also supply upgradeWith({ headers }), which upgrades the connection and sends the given headers on the 101 response; upgrade is equivalent to upgradeWith({}). WebSocket upgrades fail when headers are given. method is now typed as string because received methods such as PROPFIND are kept as is; exhaustive matches need a fallback or an HttpMethod.isHttpMethod guard."
