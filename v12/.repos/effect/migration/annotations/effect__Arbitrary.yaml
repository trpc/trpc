"effect/Arbitrary":
  replacement: "effect/Arbitrary"
  note: "Schema-derived generation now uses the native Arbitrary module. Effect no longer bridges to fast-check."
"effect/Arbitrary#ArbitraryAnnotation":
  replacement: "Schema.Annotations.ToArbitrary.Declaration"
  note: "Arbitrary derivation annotations now live in Schema.Annotations. Attach a toCodecArbitrary declaration callback that returns a Schema Link."
"effect/Arbitrary#ArbitraryGenerationContext":
  replacement: "Schema.Annotations.ToArbitrary.DeclarationInput"
  note: "Native arbitrary callbacks receive DeclarationInput with decoded type-parameter schemas and normalized constraints."
"effect/Arbitrary#LazyArbitrary":
  replacement: "effect/Arbitrary#Arbitrary"
  note: "The generated-value description is now the native Arbitrary interface from effect/Arbitrary."
"effect/Arbitrary#make":
  replacement: "effect/Arbitrary#schema"
  note: "Derive a native Arbitrary from a Schema. Effect no longer bridges to fast-check."
  example: "Arbitrary.schema(schema)"
"effect/Arbitrary#makeLazy":
  replacement: "effect/Arbitrary#schema"
  note: "Lazy and eager Schema derivation are the same native Arbitrary.schema constructor."
  example: "Arbitrary.schema(schema)"
