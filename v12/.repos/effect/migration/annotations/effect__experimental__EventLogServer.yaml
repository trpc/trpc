"@effect/experimental/EventLogServer#layerStorageMemory":
  include: true
  replacement: effect/eventlog/EventLogServerEncrypted#layerStorageMemory
  note: Use the encrypted server memory storage layer; storage is now storeId- and session-aware.
"@effect/experimental/EventLogServer#makeHandler":
  replacement: effect/eventlog/EventLogServerEncrypted#layer + effect/rpc/RpcServer#layerProtocolSocketServer
  note: Compose the encrypted server layer with the generic RPC socket server; there is no per-socket handler factory.
"@effect/experimental/EventLogServer#makeHandlerHttp":
  replacement: effect/eventlog/EventLogServerEncrypted#layer + effect/rpc/RpcServer#makeProtocolWithHttpEffectWebsocket
  note: Use the returned httpEffect for upgrades and provide its protocol to the encrypted server layer.
"@effect/experimental/EventLogServer#makeStorageMemory":
  replacement: effect/eventlog/EventLogServerEncrypted#makeStorageMemory
  note: Use the encrypted server memory storage constructor.
"@effect/experimental/EventLogServer#Storage":
  include: true
  replacement: effect/eventlog/EventLogServerEncrypted#Storage
  note: Use the storeId- and session-aware encrypted server Storage service. write and changes now operate on encrypted batches. write returns newly stored batches and skips a batch only when all its entry ids are already known. Custom storage must implement entrySequences to look up acknowledgements for skipped batches; each batch owns consecutive sequences starting at its sequence.
"@effect/experimental/EventLogServer#PersistedEntry":
  include: true
  replacement: effect/eventlog/EventLogEncryption#EncryptedBatch
  note: The per-entry class was removed; encrypted storage now accepts batch records containing entryIds, iv, and encryptedBatch. The class encoding helpers and entryIdString getter are not retained. Old per-entry ciphertext cannot be reused as an encrypted batch.
