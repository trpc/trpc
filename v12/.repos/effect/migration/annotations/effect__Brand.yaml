"effect/Brand#all":
  replacement: "Brand.all"
  note: "Still exported; combines multiple brand constructors and checks."
"effect/Brand#Brand":
  replacement: "Brand.Brand"
  note: "Still exported, but v4 brand keys are strings rather than symbols."
"effect/Brand#Brand.BrandErrors":
  replacement: "Brand.BrandError"
  note: "Validation now returns one BrandError wrapping a SchemaIssue.Issue instead of an error array."
"effect/Brand#Brand.RefinementError":
  replacement: "Schema.FilterIssue"
  note: "Brand.make validators use Schema filter output instead of the old message and meta record."
"effect/Brand#Branded":
  replacement: "Brand.Branded"
  note: "Still exported, with the brand key restricted to string."
"effect/Brand#BrandTypeId":
  replacement: "none"
  note: "The public marker was removed; the v4 brand type id is private."
"effect/Brand#error":
  replacement: "Brand.make"
  note: "Return a string or Schema filter issue directly from a Brand.make validator."
"effect/Brand#nominal":
  replacement: "Brand.nominal"
  note: "Still exported; the constructor's either method is now result."
"effect/Brand#refined":
  replacement: "Brand.make"
  note: "Use Brand.make for custom validation or Brand.check for Schema checks."
"effect/Brand#RefinedConstructorsTypeId":
  replacement: "none"
  note: "The public refined-constructor marker was removed."
"effect/Brand#unbranded":
  replacement: "Function.cast"
  note: "Brands are runtime-identical to their base value; cast explicitly when an unbranded type is required."
