effect/FiberHandle#FiberHandle:
  replacement: "FiberHandle.FiberHandle"
  note: "Retained; contained runtime fibers now use the unified Fiber type."
effect/FiberHandle#get:
  replacement: "FiberHandle.get"
  note: "Retained, but v4 returns Effect<Option<Fiber>> instead of failing with NoSuchElementException when empty."
effect/FiberHandle#TypeId:
  replacement: "FiberHandle.isFiberHandle"
  note: "The type-id symbol is private in v4; use the public guard."
effect/FiberHandle#unsafeGet:
  replacement: "FiberHandle.getUnsafe"
  note: "Renamed to put the Unsafe suffix last."
effect/FiberHandle#unsafeSet:
  replacement: "FiberHandle.setUnsafe"
  note: "Renamed to put the Unsafe suffix last; the interruptAs option was removed because IDs are now numeric runtime details."
