effect/Tracer#DisablePropagation:
  replacement: "Tracer.DisablePropagation"
  note: "Keep the reference value. The separate phantom interface is gone; the Context.Reference directly stores boolean."
effect/Tracer#ExternalSpan:
  replacement: "Tracer.ExternalSpan"
  note: "Keep the type, but rename the context field to annotations. Apply the same rename to Tracer.externalSpan options."
effect/Tracer#ParentSpan:
  replacement: "Tracer.ParentSpan"
  note: "Keep the API. It is now a Context.Service class for AnySpan rather than a separate phantom interface plus Context.Tag."
effect/Tracer#Span:
  replacement: "Tracer.Span"
  note: "Keep the type and rename span.context to span.annotations; the other public fields and methods remain."
effect/Tracer#SpanLink:
  replacement: "Tracer.SpanLink"
  note: "Keep the type but remove the _tag property; v4 links contain only span and attributes."
effect/Tracer#SpanOptions:
  replacement: "Tracer.SpanOptions"
  note: "Keep the type and rename context to annotations. V4 splits trace options and additionally accepts sampled and level."
effect/Tracer#Tracer:
  replacement: "Tracer.Tracer"
  note: "The service is now a defaulted Context.Reference. Custom implementations are structural and receive one span options object; context is optional and now receives an Effect primitive plus Fiber."
effect/Tracer#TracerTypeId:
  replacement: "none"
  note: "Tracer implementations are structural and no longer carry a public type-id brand."
effect/Tracer#tracerWith:
  replacement: "Tracer.Tracer.use"
  note: "Replace tracerWith(f) with Tracer.Tracer.use(f); do not use TracerKey, which is only the raw string key."
