effect/TSemaphore#TSemaphore:
  replacement: "TxSemaphore.TxSemaphore"
  note: "Rename the type and import from \"effect/TxSemaphore\". V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TSemaphore#TSemaphore.Proto:
  replacement: "none"
  note: "The public prototype interface was removed."
effect/TSemaphore#TSemaphoreTypeId:
  replacement: "TxSemaphore.isTxSemaphore"
  note: "The type id is internal in v4; use the public runtime guard."
effect/TSemaphore#available:
  replacement: "TxSemaphore.available"
  note: "Import TxSemaphore from \"effect/TxSemaphore\"; the operation keeps its name. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TSemaphore#make:
  replacement: "TxSemaphore.make"
  note: "Import TxSemaphore from \"effect/TxSemaphore\"; the operation keeps its name. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TSemaphore#release:
  replacement: "TxSemaphore.release"
  note: "Import TxSemaphore from \"effect/TxSemaphore\"; the operation keeps its name. V4 Tx operations return ordinary Effects; compose multiple operations under one outer Effect.tx to keep them atomic."
effect/TSemaphore#unsafeMake:
  replacement: "none"
  note: "The unsafe constructor was removed; use TxSemaphore.make."
effect/TSemaphore#withPermit:
  replacement: "TxSemaphore.withPermit"
  note: "The helper remains, but data-first calls now pass the semaphore before the Effect."
effect/TSemaphore#withPermits:
  replacement: "TxSemaphore.withPermits"
  note: "The helper remains, but data-first calls now pass semaphore, permit count, then Effect."
effect/TSemaphore#withPermitsScoped:
  replacement: "TxSemaphore.acquireN + Effect.addFinalizer(TxSemaphore.releaseN)"
  note: "No scoped multi-permit helper remains; acquire and register release explicitly in a Scope."
